d-bg:#421A22;--on-c:#0E1630;\n}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nhtml{font-size:18px;-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 74px)}\nbody{margin:0;background-color:var(--paper);\n  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);\n  background-size:28px 28px;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600;line-height:1.55}\nh1,h2,h3,h4{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.15;margin:0}\np{margin:.4em 0}\n.lesson,.tab{--c:var(--cl)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) .lesson,:root:not([data-theme=\"light\"]) .tab{--c:var(--cd)}}\n:root[data-theme=\"dark\"] .lesson,:root[data-theme=\"dark\"] .tab{--c:var(--cd)}\n.wrap{max-width:900px;margin:0 auto;padding:0 14px 40px}\n\n/* hero */\n.hero{position:relative;padding:22px 0 12px}\n.hero h1{font-size:clamp(1.65rem,6vw,2.6rem);font-weight:800;padding-right:92px;max-width:18em}\n.hero-pend{position:absolute;right:0;top:14px;width:84px;height:auto}\n.hp{transform-origin:60px 8px;animation:sw 2s ease-in-out infinite alternate}\n@keyframes sw{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}\n@media (prefers-reduced-motion:reduce){.hp{animation:none}}\n.goal{font-size:1.05rem;max-width:36em;margin-top:10px}\n.prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:800;flex-wrap:wrap}\n.pbar{display:flex;gap:5px}\n.pbar i{width:26px;height:12px;border:2.5px solid var(--edge);border-radius:6px;background:var(--card)}\n.pbar i.on{background:var(--sun)}\n\n/* tabs */\n.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 4px;\n  background:var(--paper);border-bottom:3px solid var(--edge);scrollbar-width:thin}\n.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:46px;padding:5px 14px 5px 6px;border:2.5px solid var(--edge);\n  border-radius:999px;background:var(--card);color:var(--ink);font:800 .9rem 'Nunito',sans-serif;cursor:pointer}\n.tab .tn{width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--on-c);display:grid;place-items:center;font-size:.85rem}\n.tab[aria-current=\"true\"]{background:var(--c);color:var(--on-c);box-shadow:3px 3px 0 var(--shadow)}\n.tab[aria-current=\"true\"] .tn{background:var(--on-c);color:var(--c)}\n.tab.done::after{content:\"✓\";font-weight:800}\n\n/* lesson */\n.lesson{scroll-margin-top:74px}\n.lhead{display:flex;gap:12px;align-items:center;margin:22px 0 4px}\n.num{flex:0 0 auto;width:54px;height:54px;border-radius:14px;background:var(--c);color:var(--on-c);display:grid;place-items:center;\n  font:800 1.8rem 'Baloo 2',sans-serif;border:3px solid var(--edge);transform:rotate(-4deg)}\n.lhead h2{font-size:1.55rem;font-weight:800}\n.sub{font-size:.9rem;color:var(--soft);margin:2px 0 0}\n.card{background:var(--card);border:3px solid var(--edge);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);padding:16px;margin:16px 0}\n.card>h3{font-size:1.3rem;margin-bottom:8px;color:var(--c)}\n.card h4{font-size:1.05rem;margin:14px 0 6px}\n.life{border-style:dashed}\n.remember{background:var(--sun-bg);border:3px solid var(--edge);border-radius:20px;padding:14px 18px;margin:16px 0;color:var(--ink)}\n.remember h3{font-size:1.25rem;margin-bottom:4px}\n.remember ul{margin:6px 0 0;padding-left:1.2em}\n.remember li{margin:4px 0}\n.pager{display:flex;justify-content:space-between;gap:10px;margin:18px 0 6px;flex-wrap:wrap}\n\n/* controls */\n.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.btn{min-height:50px;padding:8px 18px;border:3px solid var(--edge);border-radius:999px;background:var(--sun);color:var(--on-sun);\n  font:800 1rem 'Nunito',sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}\n.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}\n.btn.alt{background:var(--c);color:var(--on-c)}\n.btn.ghost{background:var(--card);color:var(--ink)}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n.chip{min-height:44px;padding:6px 14px;border:2.5px solid var(--edge);border-radius:12px;background:var(--card);color:var(--ink);\n  font:800 .95rem 'Nunito',sans-serif;cursor:pointer}\n.chip.on,.chip[aria-pressed=\"true\"]{background:var(--c);color:var(--on-c)}\n.chip.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}\n.chip.no{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}\nbutton:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--c);outline-offset:3px}\ninput[type=text],input[type=number],select,textarea{min-height:46px;padding:8px 12px;border:2.5px solid var(--edge);border-radius:12px;\n  background:var(--card);color:var(--ink);font:700 1rem 'Nunito',sans-serif;max-width:100%}\ntextarea{width:100%;min-height:110px}\ninput[type=range]{width:100%;accent-color:var(--c);height:34px}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.row input[type=text]{flex:1 1 180px}\n.lbl{font-weight:800;margin:12px 0 4px}\n.stage{border:3px solid var(--edge);border-radius:16px;background:var(--stage);overflow:hidden}\n.stage svg,.stage canvas{display:block;width:100%;height:auto}\n.say{margin:10px 0;padding:10px 14px;background:var(--note);border-left:6px solid var(--c);border-radius:8px}\n.read{font:800 1.3rem 'Baloo 2',sans-serif}\n.scroll{overflow-x:auto}\n.two{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}\n.two>*{flex:1 1 250px;min-width:0}\ntable.dt{width:100%;border-collapse:collapse;font-size:.95rem}\n.dt th,.dt td{border:2px solid var(--edge);padding:6px 8px;text-align:center}\n.dt th{background:var(--sun);color:var(--on-sun)}\n.msg{margin:8px 0;padding:8px 12px;border-radius:10px;background:var(--note)}\n.msg.good{background:var(--ok-bg);color:var(--ok)}\n.msg.bad{background:var(--bad-bg);color:var(--bad)}\n\n/* quiz */\n.opt{display:block;width:100%;text-align:left;margin:8px 0;min-height:48px;padding:10px 14px;border:2.5px solid var(--edge);border-radius:14px;\n  background:var(--card);color:var(--ink);font:700 1rem 'Nunito',sans-serif;cursor:pointer}\n.opt input{width:20px;height:20px;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--c)}\n.opt.sel{background:var(--note);border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}\n.opt.right{background:var(--ok-bg);border-color:var(--ok)}\n.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}\n.opt:disabled{cursor:default;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}\n.qt{font-weight:800;margin-top:14px}\n.why{margin:6px 0 12px;padding:8px 12px;border-radius:12px;font-size:.95rem}\n.why.good{background:var(--ok-bg);color:var(--ok)}\n.why.bad{background:var(--bad-bg);color:var(--bad)}\n.qscore{font:800 1.1rem 'Baloo 2',sans-serif;margin-top:10px}\n.stm{border:2.5px solid var(--edge);border-radius:14px;padding:8px 12px;margin:10px 0;background:var(--card)}\n.stm p{margin:2px 0}\n\n/* svg text */\n.svgt{fill:var(--ink);font:700 14px 'Nunito',sans-serif}\n.ct{fill:var(--soft);font:700 12px 'Nunito',sans-serif}\n.ct.b{fill:var(--ink)}\n.gl{stroke:var(--grid);stroke-width:1}\n.ax{stroke:var(--edge);stroke-width:2}\n.chart{max-width:520px;margin:0 auto}\n.stepper{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 12px;flex-wrap:wrap}\n.stepper li{flex:1 1 90px;text-align:center;padding:6px 4px;border:2.5px solid var(--edge);border-radius:10px;font-size:.85rem;font-weight:800;background:var(--card)}\n.stepper li.act{background:var(--c);color:var(--on-c)}\n.stepper li.dn{background:var(--ok-bg);color:var(--ok)}\n.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border:2.5px solid var(--edge);border-radius:12px;padding:8px 10px;margin:8px 0;background:var(--card)}\n.vrow.ok{background:var(--ok-bg);border-color:var(--ok)}\n.vrow.no{background:var(--bad-bg);border-color:var(--bad)}\n.vrow span.t{flex:1 1 180px}\n.locked{opacity:.4;pointer-events:none;filter:grayscale(.6)}\n.ring{display:block;margin:10px auto;width:150px;height:150px}\nfooter{margin:26px 0 10px;text-align:center;color:var(--soft);font-size:.85rem}\n@media (max-width:480px){html{font-size:17px}.card{padding:14px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cheader class=\"hero\">\n    \u003csvg class=\"hero-pend\" viewBox=\"0 0 120 130\" aria-hidden=\"true\">\n      \u003cline x1=\"20\" y1=\"8\" x2=\"100\" y2=\"8\" stroke=\"var(--edge)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n      \u003cg class=\"hp\">\u003cline x1=\"60\" y1=\"8\" x2=\"60\" y2=\"96\" stroke=\"var(--edge)\" stroke-width=\"3\"/>\u003ccircle cx=\"60\" cy=\"108\" r=\"16\" fill=\"#FFC93C\" stroke=\"var(--edge)\" stroke-width=\"3\"/>\u003c/g>\n    \u003c/svg>\n    \u003ch1>Fizika fanini o'rganishda qanday ko'nikmalarga ega bo'lish kerak?\u003c/h1>\n    \u003cp class=\"goal\">\u003cb>Dars maqsadi:\u003c/b> fizik olimlar kabi kuzatish, o'lchash, taxmin qilish va tajriba o'tkazishni o'z qo'ling bilan sinab ko'rasan. Har bir bandda o'zing bos, surib ko'r va tekshir!\u003c/p>\n    \u003cdiv class=\"prog\">\u003cspan>Bajarilgan bandlar:\u003c/span>\u003cb>\u003cspan id=\"progN\">0\u003c/span> / 7\u003c/b>\u003cdiv class=\"pbar\" id=\"progBar\" aria-hidden=\"true\">\u003c/div>\u003c/div>\n  \u003c/header>\n  \u003cnav class=\"tabs\" id=\"tabs\" aria-label=\"Dars bandlari\">\u003c/nav>\n  \u003cmain id=\"main\">\u003c/main>\n  \u003cfooter>7-sinf fizika: o'rganish ko'nikmalari\u003c/footer>\n\u003c/div>\n\n\u003cscript>\n(function(){\n'use strict';\n/* ---------- yordamchi funksiyalar ---------- */\nconst $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];\nconst esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nconst shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nfunction canvasSetup(cv,w,h){const d=Math.min(window.devicePixelRatio||1,2);cv.width=w*d;cv.height=h*d;const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return c}\nfunction loop(fn){let raf=0,last=0,run=false;\n  const tick=t=>{if(!run)return;const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt);if(run)raf=requestAnimationFrame(tick)};\n  return{start(){if(run)return;run=true;last=performance.now();raf=requestAnimationFrame(tick)},stop(){run=false;cancelAnimationFrame(raf)},get running(){return run}}}\nfunction tween(from,to,ms,cb,end){const t0=performance.now();const f=n=>{const p=Math.min(1,(n-t0)/ms);cb(from+(to-from)*(1-Math.pow(1-p,3)));if(p\u003c1)requestAnimationFrame(f);else if(end)end()};requestAnimationFrame(f)}\nconst pausers=[];\nconst done=new Set();\nfunction mark(i){done.add(i);const t=$(`.tab[data-i=\"${i}\"]`);if(t)t.classList.add('done');$('#progN').textContent=done.size;$$('#progBar i').forEach((x,k)=>x.classList.toggle('on',k\u003cdone.size))}\n\nfunction lineChart(o){\n  const w=o.w||360,h=o.h||250,ml=48,mr=16,mt=18,mb=46,pw=w-ml-mr,ph=h-mt-mb,ymin=o.ymin||0;\n  const X=v=>ml+pw*v/o.xmax,Y=v=>mt+ph*(1-(v-ymin)/(o.ymax-ymin));\n  let s=`\u003csvg viewBox=\"0 0 ${w} ${h}\" class=\"chart\" role=\"img\" aria-label=\"Grafik\">`;\n  for(let v=ymin;v\u003c=o.ymax;v+=o.ystep)s+=`\u003cline x1=\"${ml}\" x2=\"${w-mr}\" y1=\"${Y(v)}\" y2=\"${Y(v)}\" class=\"gl\"/>\u003ctext x=\"${ml-6}\" y=\"${Y(v)+4}\" text-anchor=\"end\" class=\"ct\">${v}\u003c/text>`;\n  for(let v=0;v\u003c=o.xmax;v+=1)s+=`\u003cline x1=\"${X(v)}\" x2=\"${X(v)}\" y1=\"${mt}\" y2=\"${mt+ph}\" class=\"gl\"/>\u003ctext x=\"${X(v)}\" y=\"${mt+ph+16}\" text-anchor=\"middle\" class=\"ct\">${v}\u003c/text>`;\n  s+=`\u003cline x1=\"${ml}\" x2=\"${ml}\" y1=\"${mt}\" y2=\"${mt+ph}\" class=\"ax\"/>\u003cline x1=\"${ml}\" x2=\"${w-mr}\" y1=\"${mt+ph}\" y2=\"${mt+ph}\" class=\"ax\"/>`;\n  s+=`\u003ctext x=\"${ml+pw/2}\" y=\"${h-6}\" text-anchor=\"middle\" class=\"ct b\">${o.xl}\u003c/text>\u003ctext transform=\"translate(12 ${mt+ph/2}) rotate(-90)\" text-anchor=\"middle\" class=\"ct b\">${o.yl}\u003c/text>`;\n  o.series.forEach(se=>{if(!se.pts.length)return;\n    s+=`\u003cpolyline fill=\"none\" style=\"stroke:${se.color}\" stroke-width=\"3.5\" stroke-linejoin=\"round\" points=\"${se.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}\"/>`;\n    se.pts.forEach(p=>{s+=`\u003ccircle cx=\"${X(p[0])}\" cy=\"${Y(p[1])}\" r=\"4.5\" style=\"fill:${se.color};stroke:var(--card)\" stroke-width=\"1.5\"/>`;\n      if(o.labels)s+=`\u003ctext x=\"${X(p[0])}\" y=\"${Y(p[1])-9}\" text-anchor=\"middle\" class=\"ct b\">${p[1]}\u003c/text>`})});\n  return s+'\u003c/svg>'}\n\nfunction quiz(mount,idx,items,silent){\n  const data=items.map(it=>({...it,opts:shuffle([{t:it.ok,c:1},...it.no.map(t=>({t,c:0}))])}));\n  mount.innerHTML=data.map((it,qi)=>`\u003cdiv class=\"q\" data-q=\"${qi}\">\u003cp class=\"qt\">${qi+1}. ${it.q}\u003c/p>\u003cdiv class=\"opts\">${it.opts.map((o,oi)=>`\u003cbutton type=\"button\" class=\"opt\" data-o=\"${oi}\">${o.t}\u003c/button>`).join('')}\u003c/div>\u003cp class=\"why\" hidden>\u003c/p>\u003c/div>`).join('')+`\u003cp class=\"qscore\" aria-live=\"polite\">\u003c/p>`;\n  let n=0,r=0;\n  mount.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const q=b.closest('.q');if(q.dataset.done)return;q.dataset.done=1;\n    const it=data[+q.dataset.q],o=it.opts[+b.dataset.o];\n    $$('.opt',q).forEach((x,k)=>{x.disabled=true;if(it.opts[k].c)x.classList.add('right')});\n    if(o.c)r++;else b.classList.add('wrong');\n    const w=$('.why',q);w.hidden=false;w.className='why '+(o.c?'good':'bad');w.textContent=(o.c?\"✔ To'g'ri! \":\"✘ Bu javob emas. \")+it.why;\n    n++;if(n===data.length){$('.qscore',mount).textContent=`Natija: ${r} / ${data.length}`;if(!silent)mark(idx)}}}\n\n/* ---------- dars ma'lumotlari ---------- */\nconst LESSONS=[\n{cl:'#0B7F8A',cd:'#4CD0DB',tab:'Kuzatish',title:\"Kuzatish ko'nikmasi\",sub:\"Fizik hodisalarni kuzatish; sezgi organlari va asboblar; natijalarni qayd etish\",\n explain:\"Kuzatish — hodisani ko'z, quloq, teri kabi sezgi organlari yoki asboblar yordamida diqqat bilan o'rganish. Fizik avval kuzatadi, keyin savol beradi. Sezgi organlari ba'zan adashadi: bir xil iliq suv birovga issiq, boshqasiga sovuq tuyulishi mumkin. Shuning uchun lupa, termometr, chizg'ich kabi asboblardan foydalanamiz. Ko'rganingni darhol yozib bor, chunki xotira aldashi mumkin.\",\n life:\"Onang qozondagi suv qaynayotganini ko'zi bilan (pufakchalar) va qulog'i bilan (shovqin) sezadi. Lekin suv aniq necha gradusligini faqat termometr aytadi.\",\n simTitle:\"Muz erishi va mayatnikni kuzat\",\n rem:[\"Kuzatish — sezgi organlari va asboblar yordamida ma'lumot to'plash.\",\"Yozuvda ko'rganingni yoz, taxminingni emas.\",\"Aniq son kerak bo'lsa, asbobdan foydalan.\"]},\n{cl:'#B85000',cd:'#FF9F4A',tab:'Muloqot',title:\"Muloqot qilish va axborotni ifodalash\",sub:\"Ma'lumotni tushunarli yetkazish; jadval, grafik, gistogramma, rasm; og'zaki va yozma tushuntirish\",\n explain:\"Fizikada topilgan natijani boshqalarga tushunarli yetkazish muhim. Ma'lumotni jadval, grafik, gistogramma yoki rasm ko'rinishida ko'rsatish mumkin. Jadval aniq sonlarni beradi, grafik o'zgarishni ko'rsatadi, gistogramma qiymatlarni solishtirishga yordam beradi, rasm esa tez tasavvur beradi. Tushuntirganda avval nima o'lchanganini, keyin nima o'zgarganini, oxirida xulosani ayt.\",\n life:\"Ob-havo dasturi kun bo'yi harorat o'zgarishini chiziq (grafik) bilan, hafta kunlarini esa ustunlar bilan ko'rsatadi. Ma'lumot bir xil, ko'rinishi esa turlicha.\",\n simTitle:\"Bir xil ma'lumot, to'rt xil ko'rinish\",\n rem:[\"Bitta ma'lumotni jadval, grafik, gistogramma va rasm bilan ko'rsatish mumkin.\",\"Tushuntirish tartibi: nima o'lchandi, qanday o'zgardi, xulosa.\",\"Sonlar yoniga birlikni (°C, s, g) yozishni unutma.\"]},\n{cl:'#6B3FE0',cd:'#A58BFF',tab:'Xulosa',title:\"Xulosa chiqarish ko'nikmasi\",sub:\"Kuzatish va tajriba natijalarini tahlil qilish; mantiqiy xulosa; turlicha xulosalar\",\n explain:\"Xulosa chiqarish — kuzatish va tajriba natijalariga tayanib mantiqiy fikr aytish. Yaxshi xulosa faqat kuzatilgan faktlardan kelib chiqadi. Bitta kuzatuvdan «hamma jismlar shunday» deb umumlashtirish xato bo'lishi mumkin. Ba'zan bir hodisadan bir nechta to'g'ri taxmin chiqadi, ularni tekshirish uchun yangi tajriba kerak bo'ladi.\",\n life:\"Ko'chada yer ho'l ekanini ko'rib, «yomg'ir yog'gan» deysan. Lekin ko'chani suv mashinasi ham yuvgan bo'lishi mumkin. To'g'ri xulosa uchun yana dalil kerak.\",\n simTitle:\"Jismni suvga tashla va xulosalarni baholа\",\n rem:[\"Xulosa kuzatilgan faktlarga tayanadi.\",\"Bitta kuzatuvdan hamma narsa haqida xulosa chiqarma.\",\"Bir hodisadan bir nechta xulosa chiqishi mumkin, ularni tajriba bilan tekshiramiz.\"]},\n{cl:'#D62839',cd:'#FF7B87',tab:'Gipoteza',title:\"Gipoteza ilgari surish va tekshirish\",sub:\"Gipoteza taklif qilish; tajriba bilan tekshirish; qabul qilish yoki yangi gipoteza\",\n explain:\"Gipoteza — hodisa haqida tekshirib ko'riladigan taxmin. U «agar ... bo'lsa, ... bo'ladi» ko'rinishida aytiladi. Gipotezani faqat tajriba tekshiradi. Natija mos kelsa gipoteza qabul qilinadi, mos kelmasa rad etilib, yangisi ilgari suriladi. Gipotezaning rad etilishi xato emas, yangi bilimdir!\",\n life:\"Qorong'i xonada chiroq yonmadi. Gipoteza: «lampochka kuygan». Boshqa lampochka o'rnatib tekshirasan: yana yonmadi. Demak, boshqa sabab bor (masalan, elektr o'chgan).\",\n simTitle:\"Mayatnik laboratoriyasi\",\n rem:[\"Gipoteza — tekshiriladigan taxmin.\",\"Tajriba gipotezani tasdiqlaydi yoki rad etadi.\",\"Rad etilgan gipoteza o'rniga yangisini ilgari surish — ilmiy usul.\"]},\n{cl:'#2456D6',cd:'#7FA6FF',tab:'Rejalashtirish',title:\"Tadqiqotni rejalashtirish ko'nikmasi\",sub:\"Muammo va maqsad; o'zgaruvchilar; usullar; jihozlar; bosqichlar\",\n explain:\"Tadqiqotni rejalashtirish — tajribani boshlashdan oldin nima qilishni o'ylab chiqish. Avval muammo va maqsad aniqlanadi. Keyin o'zgaruvchilar belgilanadi: nimani o'zgartiramiz, nimani o'zgarmas tutamiz, nimani o'lchaymiz. So'ng asboblar tanlanib, tajriba bosqichlari tartibga solinadi.\",\n life:\"Non yopishdan oldin un, suv va xamirturush miqdorini aniqlab, ishni tartib bilan boshlaysan. Aks holda natija har safar boshqacha chiqadi.\",\n simTitle:\"Tajriba rejasini tuz\",\n rem:[\"Reja: maqsad, o'zgaruvchilar, asboblar, bosqichlar.\",\"Adolatli tajribada faqat bitta kattalik o'zgaradi, qolganlari o'zgarmas.\",\"Yaxshi reja tajribani takrorlash imkonini beradi.\"]},\n{cl:'#1E8449',cd:'#5FD69A',tab:\"O'lchash\",title:\"O'lchash va asboblardan foydalanish\",sub:\"Termometr, sekundomer, tarozi; to'g'ri o'lchash; jadval va grafik\",\n explain:\"Termometr haroratni (°C), sekundomer vaqtni (s), tarozi massani (g) o'lchaydi. To'g'ri o'lchash uchun avval bo'linma qiymatini aniqla: shkalaning bir bo'lagi nechaga teng? Ko'zingni shkalaga to'g'ri tekislikda tut. O'lchashni bir necha marta takrorla, natijalarni jadvalga yoz va grafik chiz.\",\n life:\"Do'konda meva tarozida tortiladi, hamshira esa tana haroratini termometr bilan o'lchaydi. Ikkalasi ham asbobni to'g'ri o'qishga bog'liq.\",\n simTitle:\"Virtual asboblar\",\n rem:[\"Avval bo'linma qiymatini aniqla.\",\"Ko'zing shkala bilan bir tekislikda bo'lsin.\",\"Bir necha marta o'lchab, natijalarni jadvalga yoz.\"]},\n{cl:'#9A6700',cd:'#F2B84B',tab:'Tajriba',title:\"Tajriba o'tkazish va natijalarni tahlil qilish\",sub:\"Xavfsizlik qoidalari; natijalarni taqqoslash; ilmiy xulosa\",\n explain:\"Tajriba o'tkazishda birinchi navbatda xavfsizlik qoidalariga amal qilinadi. Keyin reja bo'yicha ishlab, natijalar jadvalga yoziladi. Turli sharoitdagi natijalar taqqoslanadi. Ilmiy xulosada nima qilingani, qanday natija olingani va bundan nima kelib chiqishi yoziladi.\",\n life:\"Oshxonada qaynoq suv quyayotganda qo'lingni kuydirmaslik uchun ehtiyot bo'lasan. Tajribada ham xuddi shunday: avval xavfsizlik, keyin natija.\",\n simTitle:\"Xavfsizlik va virtual tajriba\",\n rem:[\"Tajribadan oldin xavfsizlik qoidalarini bil.\",\"Natijalarni jadval va grafikda taqqosla.\",\"Ilmiy xulosa: nima qildim, nima chiqdi, bundan nima kelib chiqadi.\"]}\n];\n\n/* ---------- sahifani qurish ---------- */\nconst tabs=$('#tabs'),main=$('#main');\n$('#progBar').innerHTML='\u003ci>\u003c/i>'.repeat(7);\nLESSONS.forEach((L,k)=>{const i=k+1;\n  main.insertAdjacentHTML('beforeend',`\u003csection class=\"lesson\" id=\"L${i}\" style=\"--cl:${L.cl};--cd:${L.cd}\" hidden>\n   \u003cdiv class=\"lhead\">\u003cspan class=\"num\">${i}\u003c/span>\u003cdiv>\u003ch2>${L.title}\u003c/h2>\u003cp class=\"sub\">${L.sub}\u003c/p>\u003c/div>\u003c/div>\n   \u003carticle class=\"card\">\u003ch3>Tushuntirish\u003c/h3>\u003cp>${L.explain}\u003c/p>\u003c/article>\n   \u003carticle class=\"card life\">\u003ch3>Hayotiy misol\u003c/h3>\u003cp>${L.life}\u003c/p>\u003c/article>\n   \u003carticle class=\"card\">\u003ch3>Simulyatsiya: ${L.simTitle}\u003c/h3>\u003cdiv id=\"sim${i}\">\u003c/div>\u003c/article>\n   \u003carticle class=\"card\">\u003ch3>Nazorat savollari\u003c/h3>\u003cdiv id=\"quiz${i}\">\u003c/div>\u003c/article>\n   \u003caside class=\"remember\">\u003ch3>Eslab qol\u003c/h3>\u003cul>${L.rem.map(x=>`\u003cli>${x}\u003c/li>`).join('')}\u003c/ul>\u003c/aside>\n   \u003cdiv class=\"pager\">${i>1?`\u003cbutton class=\"btn ghost\" data-go=\"${i-1}\">Oldingi band\u003c/button>`:'\u003cspan>\u003c/span>'}\u003cbutton class=\"btn alt\" data-go=\"${i+1}\">${i\u003c7?'Keyingi band':'Umumiy testga o\\'tish'}\u003c/button>\u003c/div>\n  \u003c/section>`);\n  tabs.insertAdjacentHTML('beforeend',`\u003cbutton class=\"tab\" style=\"--cl:${L.cl};--cd:${L.cd}\" data-i=\"${i}\">\u003cspan class=\"tn\">${i}\u003c/span>${L.tab}\u003c/button>`)});\nmain.insertAdjacentHTML('beforeend',`\u003csection class=\"lesson\" id=\"L8\" style=\"--cl:#14213D;--cd:#FFC93C\" hidden>\n  \u003cdiv class=\"lhead\">\u003cspan class=\"num\">★\u003c/span>\u003cdiv>\u003ch2>Umumiy test\u003c/h2>\u003cp class=\"sub\">10 ta savol. Hammasiga javob bergach, natijani ko'r.\u003c/p>\u003c/div>\u003c/div>\n  \u003carticle class=\"card\">\u003cdiv id=\"testMount\">\u003c/div>\u003c/article>\n  \u003cdiv class=\"pager\">\u003cbutton class=\"btn ghost\" data-go=\"7\">Oldingi band\u003c/button>\u003cspan>\u003c/span>\u003c/div>\u003c/section>`);\ntabs.insertAdjacentHTML('beforeend',`\u003cbutton class=\"tab\" style=\"--cl:#14213D;--cd:#FFC93C\" data-i=\"8\">\u003cspan class=\"tn\">★\u003c/span>Test\u003c/button>`);\n\nfunction go(i,noScroll){pausers.forEach(f=>f());$$('.lesson').forEach(s=>s.hidden=s.id!=='L'+i);\n  $$('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.i==i?'true':'false'));\n  const t=$(`.tab[data-i=\"${i}\"]`);if(t&&t.scrollIntoView)t.scrollIntoView({block:'nearest',inline:'center'});\n  if(!noScroll){const s=$('#L'+i);if(s)s.scrollIntoView({block:'start'})}}\ntabs.onclick=e=>{const b=e.target.closest('.tab');if(b)go(+b.dataset.i)};\nmain.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});\n\n/* =====================================================\n   1. KUZATISH\n   ===================================================== */\nfunction initS1(){\n  const R=$('#sim1');\n  R.innerHTML=`\n  \u003cdiv class=\"stage\">\u003csvg viewBox=\"0 0 640 300\" role=\"img\" aria-label=\"Chapda tebranayotgan mayatnik, o'ngda stakandagi erayotgan muz\">\n    \u003cline x1=\"60\" y1=\"24\" x2=\"240\" y2=\"24\" stroke=\"var(--edge)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n    \u003cline id=\"o-rod\" x1=\"150\" y1=\"24\" x2=\"150\" y2=\"194\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n    \u003ccircle id=\"o-bob\" cx=\"150\" cy=\"194\" r=\"18\" style=\"fill:var(--c);stroke:var(--edge)\" stroke-width=\"3\"/>\n    \u003ccircle cx=\"150\" cy=\"24\" r=\"5\" style=\"fill:var(--edge)\"/>\n    \u003crect id=\"o-water\" x=\"402\" y=\"190\" width=\"136\" height=\"80\" fill=\"#7CC6FE\" opacity=\".75\"/>\n    \u003crect id=\"o-ice\" x=\"438\" y=\"184\" width=\"64\" height=\"64\" rx=\"8\" fill=\"#E4F8FF\" stroke=\"#4FA3D9\" stroke-width=\"3\" opacity=\".92\"/>\n    \u003cpath d=\"M400 130 L406 270 Q407 274 412 274 L528 274 Q533 274 534 270 L540 130\" fill=\"none\" style=\"stroke:var(--edge)\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n    \u003ctext x=\"150\" y=\"292\" text-anchor=\"middle\" class=\"svgt\">Mayatnik\u003c/text>\n    \u003ctext x=\"470\" y=\"294\" text-anchor=\"middle\" class=\"svgt\">Stakandagi muz\u003c/text>\n  \u003c/svg>\u003c/div>\n  \u003cp>Muz erishi vaqti: \u003cspan class=\"read\" id=\"o-ti\">0.0\u003c/span> daqiqa \u003cspan class=\"sub\">(tezlashtirilgan)\u003c/span>\u003c/p>\n  \u003cdiv class=\"btns\">\u003cbutton class=\"btn alt\" id=\"o-go\">▶ Boshlash\u003c/button>\u003cbutton class=\"btn\" id=\"o-pause\">⏸ To'xtatish\u003c/button>\u003cbutton class=\"btn ghost\" id=\"o-reset\">↺ Qayta boshlash\u003c/button>\u003c/div>\n  \u003cp class=\"lbl\">Qanday kuzatamiz? Birini bos:\u003c/p>\n  \u003cdiv class=\"btns\" id=\"o-senses\">\n    \u003cbutton class=\"chip\" data-s=\"eye\">👁 Ko'rish\u003c/button>\u003cbutton class=\"chip\" data-s=\"ear\" aria-pressed=\"false\">👂 Eshitish\u003c/button>\n    \u003cbutton class=\"chip\" data-s=\"touch\">✋ Teginish\u003c/button>\u003cbutton class=\"chip\" data-s=\"lens\" aria-pressed=\"false\">🔍 Lupa\u003c/button>\u003cbutton class=\"chip\" data-s=\"therm\">🌡 Termometr\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"say\" id=\"o-say\" aria-live=\"polite\">Sezgi yoki asbobni tanla va nimani bilib olishingni o'qi.\u003c/div>\n  \u003cdiv class=\"stage\" id=\"o-lens\" hidden>\u003csvg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"Lupa ostida muz\">\n    \u003crect x=\"70\" y=\"15\" width=\"260\" height=\"160\" rx=\"18\" fill=\"#E4F8FF\" stroke=\"#4FA3D9\" stroke-width=\"4\"/>\n    \u003ccircle cx=\"120\" cy=\"60\" r=\"7\" fill=\"#fff\" stroke=\"#8CC9EA\" stroke-width=\"2\"/>\u003ccircle cx=\"210\" cy=\"110\" r=\"10\" fill=\"#fff\" stroke=\"#8CC9EA\" stroke-width=\"2\"/>\n    \u003ccircle cx=\"270\" cy=\"55\" r=\"5\" fill=\"#fff\" stroke=\"#8CC9EA\" stroke-width=\"2\"/>\u003ccircle cx=\"160\" cy=\"140\" r=\"6\" fill=\"#fff\" stroke=\"#8CC9EA\" stroke-width=\"2\"/>\n    \u003cpath d=\"M90 40 L150 90 L140 150 M150 90 L250 70 L300 120\" fill=\"none\" stroke=\"#8CC9EA\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"200\" y=\"186\" text-anchor=\"middle\" class=\"svgt\" style=\"font-size:12px\">Lupa ostida: havo pufakchalari va mayda yoriqlar\u003c/text>\u003c/svg>\u003c/div>\n  \u003ch4>Mening kuzatuv jadvalim\u003c/h4>\n  \u003cdiv class=\"row\">\u003cselect id=\"o-sel\" aria-label=\"Sezgi yoki asbob\">\u003coption>Ko'z bilan\u003c/option>\u003coption>Quloq bilan\u003c/option>\u003coption>Teginish bilan\u003c/option>\u003coption>Lupa bilan\u003c/option>\u003coption>Termometr bilan\u003c/option>\u003c/select>\n  \u003cinput type=\"text\" id=\"o-txt\" placeholder=\"Masalan: muz yarmiga kichraydi\" aria-label=\"Kuzatuv\">\u003cbutton class=\"btn alt\" id=\"o-add\">Yozib qo'yish\u003c/button>\u003c/div>\n  \u003cp class=\"msg\" id=\"o-msg\" hidden>\u003c/p>\n  \u003cdiv class=\"scroll\">\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Vaqt (daq)\u003c/th>\u003cth>Sezgi / asbob\u003c/th>\u003cth>Kuzatuv\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"o-rows\">\u003ctr>\u003ctd colspan=\"4\">Hali yozuv yo'q. Sahnani ishga tushirib, kuzatganingni yoz.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>`;\n  const rod=$('#o-rod',R),bob=$('#o-bob',R),ice=$('#o-ice',R),water=$('#o-water',R),tiEl=$('#o-ti',R);\n  let t=0,ti=0,sound=false,actx=null,prev=1,lens=false;\n  function tick(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.06)}catch(e){}}\n  function draw(snd){\n    const th=25*Math.PI/180*Math.cos(Math.PI*t),x=150+170*Math.sin(th),y=24+170*Math.cos(th);\n    rod.setAttribute('x2',x);rod.setAttribute('y2',y);bob.setAttribute('cx',x);bob.setAttribute('cy',y);\n    const s=th>=0?1:-1;if(snd&&sound&&s!==prev)tick();prev=s;\n    const f=Math.min(1,ti/10),sz=64*Math.cbrt(1-f),wt=190-10*f;\n    water.setAttribute('y',wt);water.setAttribute('height',270-wt);\n    ice.setAttribute('x',470-sz/2);ice.setAttribute('y',wt-.1*sz);ice.setAttribute('width',sz);ice.setAttribute('height',sz);\n    tiEl.textContent=ti.toFixed(1)}\n  const lp=loop(dt=>{t+=dt;if(ti\u003c10)ti=Math.min(10,ti+dt*.25);draw(true)});pausers.push(lp.stop);\n  draw(false);\n  $('#o-go',R).onclick=()=>lp.start();\n  $('#o-pause',R).onclick=()=>lp.stop();\n  $('#o-reset',R).onclick=()=>{lp.stop();t=0;ti=0;draw(false)};\n  const say=$('#o-say',R);\n  $('#o-senses',R).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const s=b.dataset.s;\n    if(s==='eye')say.textContent=\"Ko'zing rang, shakl, o'lcham va harakatni ko'radi: mayatnik chapga-o'ngga tebranadi, muz kichrayadi, stakanda suv ko'payadi. Lekin ko'z juda mayda narsalarni ko'rmaydi.\";\n    if(s==='ear'){sound=!sound;b.setAttribute('aria-pressed',sound);if(sound)tick();say.textContent=sound?\"Ovoz yoqildi: mayatnik eng past nuqtadan o'tganda «tik» eshitiladi. Quloq tebranish ritmini sezishga yordam beradi. Sahnani ishga tushir!\":\"Ovoz o'chirildi.\"}\n    if(s==='touch')say.textContent=\"Barmoq bilan muz sovuq va silliq tuyuladi. Lekin «sovuq» — taxminiy his, uni songa aylantirib bo'lmaydi. Aniq harorat uchun termometr kerak. Haqiqiy tajribada issiq yoki o'tkir jismlarni ushlab ko'rma!\";\n    if(s==='lens'){lens=!lens;b.setAttribute('aria-pressed',lens);$('#o-lens',R).hidden=!lens;say.textContent=lens?\"Lupa kichik narsalarni kattalashtiradi. Endi muzdagi havo pufakchalari va mayda yoriqlar ko'rinadi. Ko'z bilan ularni yaxshi ko'rmasdik.\":\"Lupa olib qo'yildi.\"}\n    if(s==='therm')say.textContent=ti\u003c10?\"Termometr aniq son beradi: stakandagi muz va suv aralashmasi taxminan 0 °C.\":\"Muz to'liq erib bo'ldi. Termometr suv 0 °C dan yuqoriga isiy boshlaganini ko'rsatadi.\"};\n  const obs=[];\n  function render(){const tb=$('#o-rows',R);if(!obs.length){tb.innerHTML='\u003ctr>\u003ctd colspan=\"4\">Hali yozuv yo\\'q. Sahnani ishga tushirib, kuzatganingni yoz.\u003c/td>\u003c/tr>';return}\n    tb.innerHTML=obs.map((o,i)=>`\u003ctr>\u003ctd>${o.t}\u003c/td>\u003ctd>${esc(o.s)}\u003c/td>\u003ctd>${esc(o.v)}\u003c/td>\u003ctd>\u003cbutton class=\"chip\" data-d=\"${i}\" aria-label=\"O'chirish\">✕\u003c/button>\u003c/td>\u003c/tr>`).join('')}\n  $('#o-add',R).onclick=()=>{const inp=$('#o-txt',R),m=$('#o-msg',R),v=inp.value.trim();\n    if(v.length\u003c6){m.hidden=false;m.className='msg bad';m.textContent=\"Kuzatuvni aniqroq yoz: nima o'zgardi? Masalan: «Muz kichrayib, atrofida suv paydo bo'ldi».\";return}\n    const sel=$('#o-sel',R);obs.push({t:ti.toFixed(1),s:sel.options[sel.selectedIndex].text,v});inp.value='';\n    m.hidden=false;m.className='msg good';m.textContent=\"Yaxshi! Kuzatuvni vaqti bilan yozding.\";render()};\n  $('#o-rows',R).onclick=e=>{const b=e.target.closest('[data-d]');if(b){obs.splice(+b.dataset.d,1);render()}};\n}\n\n/* =====================================================\n   2. MULOQOT\n   ===================================================== */\nfunction initS2(){\n  const R=$('#sim2'),MIN=[0,1,2,3,4,5],TMP=[20,32,44,55,65,74];\n  R.innerHTML=`\n  \u003cp>Choynakdagi suv isitildi. Har daqiqada harorat o'lchandi. Bir xil ma'lumotni to'rt xil ko'rinishda ko'r:\u003c/p>\n  \u003cdiv class=\"btns\" id=\"v-btns\">\u003cbutton class=\"chip on\" data-v=\"jadval\">Jadval\u003c/button>\u003cbutton class=\"chip\" data-v=\"grafik\">Grafik\u003c/button>\u003cbutton class=\"chip\" data-v=\"gist\">Gistogramma\u003c/button>\u003cbutton class=\"chip\" data-v=\"rasm\">Rasm\u003c/button>\u003c/div>\n  \u003cdiv class=\"stage\" style=\"padding:10px\" id=\"v-view\">\u003c/div>\n  \u003cp class=\"say\" id=\"v-info\">\u003c/p>\n  \u003ch4>Vaziyatni yech: qaysi ko'rinish mos?\u003c/h4>\n  \u003cp id=\"v-sc\" class=\"lbl\">\u003c/p>\u003cdiv class=\"btns\" id=\"v-ans\">\u003cbutton class=\"chip\" data-a=\"jadval\">Jadval\u003c/button>\u003cbutton class=\"chip\" data-a=\"grafik\">Grafik\u003c/button>\u003cbutton class=\"chip\" data-a=\"gist\">Gistogramma\u003c/button>\u003cbutton class=\"chip\" data-a=\"rasm\">Rasm\u003c/button>\u003c/div>\n  \u003cp class=\"msg\" id=\"v-fb\" hidden>\u003c/p>\u003cbutton class=\"btn ghost\" id=\"v-next\">Keyingi vaziyat\u003c/button>\n  \u003ch4>Ma'lumotni so'z bilan tushuntir\u003c/h4>\n  \u003cdiv class=\"row\">\u003clabel>Boshlanish: \u003cselect id=\"s-a\">\u003c/select>\u003c/label>\u003clabel>Tugash: \u003cselect id=\"s-b\">\u003c/select>\u003c/label>\u003c/div>\n  \u003cdiv class=\"say\" id=\"s-out\" aria-live=\"polite\">\u003c/div>`;\n  const INFO={jadval:\"Jadval aniq sonlarni beradi, lekin o'zgarishni sezish uchun sonlarni o'qib chiqish kerak.\",grafik:\"Grafik o'zgarish yo'nalishini ko'rsatadi: chiziq yuqoriga ko'tarilsa, harorat oshmoqda.\",gist:\"Gistogramma ustunlar balandligini solishtirishga qulay: eng baland ustun — eng issiq payt.\",rasm:\"Rasm (termometrlar) tez tasavvur beradi: simob qancha baland bo'lsa, suv shuncha issiq.\"};\n  function view(v){$$('#v-btns .chip',R).forEach(c=>c.classList.toggle('on',c.dataset.v===v));let s='';\n    if(v==='jadval')s=`\u003cdiv class=\"scroll\">\u003ctable class=\"dt\">\u003ctr>\u003cth>Vaqt (daq)\u003c/th>${MIN.map(m=>`\u003ctd>${m}\u003c/td>`).join('')}\u003c/tr>\u003ctr>\u003cth>Harorat (°C)\u003c/th>${TMP.map(x=>`\u003ctd>${x}\u003c/td>`).join('')}\u003c/tr>\u003c/table>\u003c/div>`;\n    if(v==='grafik')s=lineChart({series:[{pts:MIN.map((m,i)=>[m,TMP[i]]),color:'var(--c)'}],xmax:5,ymax:80,ystep:20,xl:'Vaqt (daq)',yl:'Harorat (°C)',labels:true});\n    if(v==='gist'){const W=360,H=250,ml=48,mt=18,pw=296,ph=186;const Y=x=>mt+ph*(1-x/80);\n      s=`\u003csvg viewBox=\"0 0 ${W} ${H}\" class=\"chart\" role=\"img\" aria-label=\"Gistogramma\">`;\n      for(let x=0;x\u003c=80;x+=20)s+=`\u003cline x1=\"${ml}\" x2=\"${W-16}\" y1=\"${Y(x)}\" y2=\"${Y(x)}\" class=\"gl\"/>\u003ctext x=\"${ml-6}\" y=\"${Y(x)+4}\" text-anchor=\"end\" class=\"ct\">${x}\u003c/text>`;\n      TMP.forEach((x,i)=>{const bx=ml+pw*(i+.5)/6-20;s+=`\u003crect x=\"${bx}\" y=\"${Y(x)}\" width=\"40\" height=\"${mt+ph-Y(x)}\" style=\"fill:var(--c);stroke:var(--edge)\" stroke-width=\"2\"/>\u003ctext x=\"${bx+20}\" y=\"${Y(x)-5}\" text-anchor=\"middle\" class=\"ct b\">${x}\u003c/text>\u003ctext x=\"${bx+20}\" y=\"${mt+ph+16}\" text-anchor=\"middle\" class=\"ct\">${MIN[i]}\u003c/text>`});\n      s+=`\u003cline x1=\"${ml}\" x2=\"${ml}\" y1=\"${mt}\" y2=\"${mt+ph}\" class=\"ax\"/>\u003cline x1=\"${ml}\" x2=\"${W-16}\" y1=\"${mt+ph}\" y2=\"${mt+ph}\" class=\"ax\"/>\u003ctext x=\"${ml+pw/2}\" y=\"${H-6}\" text-anchor=\"middle\" class=\"ct b\">Vaqt (daq)\u003c/text>\u003ctext transform=\"translate(12 ${mt+ph/2}) rotate(-90)\" text-anchor=\"middle\" class=\"ct b\">Harorat (°C)\u003c/text>\u003c/svg>`}\n    if(v==='rasm'){s=`\u003csvg viewBox=\"0 0 360 230\" class=\"chart\" role=\"img\" aria-label=\"Termometrlar rasmi\">`;\n      TMP.forEach((x,i)=>{const cx=30+i*60,top=20,bh=140,fh=bh*x/80;\n        s+=`\u003crect x=\"${cx-9}\" y=\"${top}\" width=\"18\" height=\"${bh}\" rx=\"9\" style=\"fill:var(--card);stroke:var(--edge)\" stroke-width=\"2.5\"/>\u003crect x=\"${cx-5}\" y=\"${top+bh-fh}\" width=\"10\" height=\"${fh}\" fill=\"#FF6B4A\"/>\u003ccircle cx=\"${cx}\" cy=\"${top+bh+10}\" r=\"13\" fill=\"#FF6B4A\" style=\"stroke:var(--edge)\" stroke-width=\"2.5\"/>\u003ctext x=\"${cx}\" y=\"${top+bh+40}\" text-anchor=\"middle\" class=\"ct b\">${x}°\u003c/text>\u003ctext x=\"${cx}\" y=\"${top+bh+56}\" text-anchor=\"middle\" class=\"ct\">${MIN[i]} daq\u003c/text>`});\n      s+='\u003c/svg>'}\n    $('#v-view',R).innerHTML=s;$('#v-info',R).textContent=INFO[v]}\n  $('#v-btns',R).onclick=e=>{const b=e.target.closest('.chip');if(b)view(b.dataset.v)};view('jadval');\n  const SC=[[\"3-daqiqadagi aniq haroratni bilmoqchisan. Qaysi ko'rinish qulay?\",'jadval',\"Jadval aniq sonlarni beradi.\"],\n   [\"Harorat vaqt o'tishi bilan qanday o'zgarayotganini ko'rmoqchisan.\",'grafik',\"Grafik chizig'i o'zgarish yo'nalishini ko'rsatadi.\"],\n   [\"Turli daqiqalardagi haroratlarni tez solishtirmoqchisan.\",'gist',\"Ustun balandliklarini yonma-yon solishtirish oson.\"],\n   [\"Hodisani kichkina ukangga tushuntirmoqchisan.\",'rasm',\"Rasm eng oddiy va ko'rgazmali.\"]];\n  let sc=0;const fb=$('#v-fb',R);\n  function showSc(){$('#v-sc',R).textContent=SC[sc][0];fb.hidden=true}\n  showSc();\n  $('#v-ans',R).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const ok=b.dataset.a===SC[sc][1];view(SC[sc][1]);\n    fb.hidden=false;fb.className='msg '+(ok?'good':'bad');fb.textContent=(ok?\"✔ To'g'ri! \":\"✘ Yana o'yla. Eng mosi ko'rsatildi. \")+SC[sc][2]};\n  $('#v-next',R).onclick=()=>{sc=(sc+1)%SC.length;showSc()};\n  const A=$('#s-a',R),B=$('#s-b',R);A.innerHTML=MIN.map(m=>`\u003coption value=\"${m}\">${m}-daqiqa\u003c/option>`).join('');B.innerHTML=A.innerHTML;A.value=1;B.value=5;\n  function sent(){const a=+A.value,b=+B.value,o=$('#s-out',R);\n    if(a>=b){o.textContent=\"Boshlanish daqiqasi tugash daqiqasidan kichik bo'lsin.\";return}\n    const d=TMP[b]-TMP[a];\n    o.innerHTML=`\u003cb>Yozma (hisobot):\u003c/b> Suv harorati ${a}-daqiqada ${TMP[a]} °C edi, ${b}-daqiqada esa ${TMP[b]} °C ga yetdi. Demak, ${b-a} daqiqada harorat ${d} °C ga oshdi.\u003cbr>\u003cbr>\u003cb>Og'zaki (grafikka ishora qilib):\u003c/b> «Do'stlar, grafikka qarang. Suv ${a}-daqiqada ${TMP[a]} gradus edi. Chiziq yuqoriga ko'tarilib, ${b}-daqiqada ${TMP[b]} gradusga yetdi. Demak, suv isidi.»`}\n  A.onchange=B.onchange=sent;sent();\n}\n\n/* =====================================================\n   3. XULOSA\n   ===================================================== */\nfunction initS3(){\n  const R=$('#sim3');\n  const OBJ={\n   taxta:{name:\"Yog'och taxta\",ico:\"🪵\",kind:'float',r:18,obs:\"Taxta suv yuzasida suzdi.\",st:[\n    [\"Bu taxta suvda suzadi.\",1,\"Bu kuzatuvdan to'g'ridan-to'g'ri kelib chiqadi.\"],\n    [\"Taxta suzdi, demak u shu hajmdagi suvdan yengil bo'lishi mumkin.\",1,\"Bu kuzatuvga mos, ehtiyotkor taxmin.\"],\n    [\"Barcha jismlar suvda suzadi.\",0,\"Bitta kuzatuvdan hamma jismlar haqida xulosa chiqarib bo'lmaydi. Tosh cho'kadi-ku!\"],\n    [\"Taxta quruq bo'lgani uchun suzdi.\",0,\"Quruqlik haqida hech narsa kuzatilmadi. Bu sabab uydirma.\"]]},\n   tosh:{name:\"Tosh\",ico:\"🪨\",kind:'sink',r:22,a:300,obs:\"Tosh suvda cho'kdi.\",st:[\n    [\"Bu tosh suvda cho'kadi.\",1,\"Bu kuzatuvning o'zi.\"],\n    [\"Tosh cho'kdi, demak u shu hajmdagi suvdan og'irroq bo'lishi mumkin.\",1,\"Kuzatuvga mos, ehtiyotkor taxmin.\"],\n    [\"Barcha toshlar cho'kadi.\",0,\"Bitta toshga qarab hamma toshlar haqida gapirish shoshma-shosharlik.\"],\n    [\"Suv hamma narsani cho'ktiradi.\",0,\"Taxta suzgani kabi boshqa jismlar suzishi mumkin. Bu xulosa asossiz.\"]]},\n   mix:{name:\"Temir mix\",ico:\"📌\",kind:'sink',r:8,a:240,obs:\"Kichkina temir mix suvda cho'kdi.\",st:[\n    [\"Temir mix suvda cho'kdi.\",1,\"Bu kuzatuvning o'zi.\"],\n    [\"Mix kichkina bo'lsa ham cho'kdi, demak kichikligi suzish uchun yetarli emas.\",1,\"Kuzatuvdan mantiqan kelib chiqadi.\"],\n    [\"Kichik jismlar doim suzadi.\",0,\"Mix kichkina, lekin cho'kdi. Xulosa kuzatuvga zid.\"],\n    [\"Mix uchi o'tkir bo'lgani uchun cho'kdi.\",0,\"O'tkirlik haqida tajriba qilinmadi. Sabab tekshirilmagan.\"]]},\n   olma:{name:\"Olma\",ico:\"🍎\",kind:'float',r:26,obs:\"Olma suvda suzdi, yarmidan ko'pi suv ostida qoldi.\",st:[\n    [\"Olma suvda suzadi.\",1,\"Bu kuzatuvning o'zi.\"],\n    [\"Olma suvdan biroz yengil bo'lishi mumkin.\",1,\"Suzgani uchun bu mantiqli taxmin.\"],\n    [\"Barcha mevalar suzadi.\",0,\"Faqat olmani sinadik. Boshqa mevalar haqida gapirib bo'lmaydi.\"],\n    [\"Olma qizil bo'lgani uchun suzdi.\",0,\"Rang haqida hech narsa kuzatilmadi.\"]]}};\n  R.innerHTML=`\n  \u003cp>Jismni tanla va suvga tashla. Nima bo'lganini kuzat, keyin gaplar mantiqli yoki mantiqsizligini ayt.\u003c/p>\n  \u003cdiv class=\"btns\" id=\"f-obj\">${Object.keys(OBJ).map((k,i)=>`\u003cbutton class=\"chip${i?'':' on'}\" data-k=\"${k}\">${OBJ[k].ico} ${OBJ[k].name}\u003c/button>`).join('')}\u003c/div>\n  \u003cdiv class=\"stage\">\u003ccanvas id=\"f-cv\" aria-label=\"Stakan suv va tashlanayotgan jism\">\u003c/canvas>\u003c/div>\n  \u003cdiv class=\"btns\">\u003cbutton class=\"btn alt\" id=\"f-go\">▶ Boshlash\u003c/button>\u003cbutton class=\"btn\" id=\"f-pause\">⏸ To'xtatish\u003c/button>\u003cbutton class=\"btn ghost\" id=\"f-reset\">↺ Qayta boshlash\u003c/button>\u003c/div>\n  \u003cdiv id=\"f-st\">\u003cp class=\"msg\">Avval jismni suvga tashla, natijani kuzat.\u003c/p>\u003c/div>\n  \u003cp class=\"say\">\u003cb>Bilib qo'y:\u003c/b> bir hodisadan bir nechta to'g'ri xulosa chiqishi mumkin. Masalan, toshning cho'kishidan «tosh og'ir» va «tosh suvdan zichroq» deyish mumkin. Qaysi biri to'g'riligini yangi tajriba hal qiladi.\u003c/p>`;\n  const cv=$('#f-cv',R),ctx=canvasSetup(cv,720,340);\n  const SURF=160,FLOOR=326,X0=250,X1=470;\n  let key='taxta',st,rip=[];\n  function reset(){st={y:34,vy:0,ent:false,rest:0,fin:false};rip=[];$('#f-st',R).innerHTML='\u003cp class=\"msg\">Avval jismni suvga tashla, natijani kuzat.\u003c/p>';draw()}\n  function drawObj(o,x,y){const c=ctx;c.lineWidth=3;c.strokeStyle='#3A2A1A';\n    if(key==='taxta'){c.fillStyle='#C68B4E';c.fillRect(x-32,y-18,64,36);c.strokeRect(x-32,y-18,64,36);c.beginPath();c.moveTo(x-26,y-6);c.lineTo(x+26,y-6);c.moveTo(x-26,y+6);c.lineTo(x+26,y+6);c.lineWidth=1.5;c.stroke()}\n    if(key==='tosh'){c.fillStyle='#8A8F98';c.beginPath();[[-26,8],[-14,-20],[8,-22],[28,-4],[20,20],[-12,22]].forEach((p,i)=>i?c.lineTo(x+p[0],y+p[1]):c.moveTo(x+p[0],y+p[1]));c.closePath();c.fill();c.stroke()}\n    if(key==='mix'){c.fillStyle='#6B7280';c.fillRect(x-32,y-4,64,8);c.strokeRect(x-32,y-4,64,8);c.beginPath();c.arc(x-34,y,9,0,7);c.fill();c.stroke()}\n    if(key==='olma'){c.fillStyle='#E63946';c.beginPath();c.arc(x,y,26,0,7);c.fill();c.stroke();c.fillStyle='#2A9D5C';c.beginPath();c.ellipse(x+8,y-30,10,5,-.6,0,7);c.fill();c.beginPath();c.moveTo(x,y-26);c.lineTo(x+2,y-34);c.stroke()}}\n  function draw(){const c=ctx,ink=cssv('--ink'),edge=cssv('--edge'),o=OBJ[key];c.clearRect(0,0,720,340);\n    drawObj(o,360,st.y);\n    c.fillStyle='rgba(70,160,240,.45)';c.fillRect(X0+2,SURF,X1-X0-4,FLOOR+14-SURF);\n    c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=2;c.beginPath();c.moveTo(X0+2,SURF);c.lineTo(X1-2,SURF);c.stroke();\n    rip.forEach(r=>{c.strokeStyle=`rgba(255,255,255,${Math.max(0,r.a)})`;c.lineWidth=2;c.beginPath();c.ellipse(360,SURF,r.r,r.r*.25,0,0,7);c.stroke()});\n    c.strokeStyle=edge;c.lineWidth=5;c.lineJoin='round';c.beginPath();c.moveTo(X0,100);c.lineTo(X0,FLOOR+14);c.lineTo(X1,FLOOR+14);c.lineTo(X1,100);c.stroke();\n    c.fillStyle=ink;c.font=\"700 15px Nunito,sans-serif\";c.textAlign='center';c.fillText('Suv',360+80,FLOOR+8);c.textAlign='left'}\n  function step(dt){const o=OBJ[key];rip.forEach(r=>{r.r+=70*dt;r.a-=dt*1.1});rip=rip.filter(r=>r.a>0);\n    if(!st.ent){st.vy+=700*dt;st.y+=st.vy*dt;if(st.y+o.r>=SURF){st.ent=true;rip.push({r:6,a:1});rip.push({r:0,a:.7});st.vy*=.55}}\n    else if(o.kind==='float'){const eq=SURF-o.r*.25;st.vy+=(-80*(st.y-eq)-3.2*st.vy)*dt;st.y+=st.vy*dt;\n      if(Math.abs(st.vy)\u003c4&&Math.abs(st.y-eq)\u003c1)st.rest+=dt;else st.rest=0;if(st.rest>.7)st.fin=true}\n    else{st.vy+=(o.a-4.5*st.vy)*dt;st.y+=st.vy*dt;if(st.y+o.r>=FLOOR){st.y=FLOOR-o.r;st.vy=0;st.fin=true}}}\n  const lp=loop(dt=>{step(dt);draw();if(st.fin){lp.stop();onFin()}});pausers.push(lp.stop);\n  function onFin(){const o=OBJ[key];$('#f-st',R).innerHTML=`\u003cp class=\"say\">\u003cb>Kuzatuv:\u003c/b> ${o.obs}\u003c/p>\u003cp class=\"lbl\">Qaysi gaplar shu kuzatishdan mantiqli kelib chiqadi?\u003c/p>`+\n    o.st.map((s,i)=>`\u003cdiv class=\"stm\" data-i=\"${i}\">\u003cp>${s[0]}\u003c/p>\u003cdiv class=\"btns\">\u003cbutton class=\"chip\" data-a=\"1\">✔ Mantiqli\u003c/button>\u003cbutton class=\"chip\" data-a=\"0\">✘ Mantiqsiz\u003c/button>\u003c/div>\u003cp class=\"why\" hidden>\u003c/p>\u003c/div>`).join('')}\n  $('#f-st',R).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const box=b.closest('.stm'),s=OBJ[key].st[+box.dataset.i],ok=(b.dataset.a==='1')===!!s[1];\n    $$('.chip',box).forEach(x=>{x.disabled=true});b.classList.add(ok?'ok':'no');const w=$('.why',box);w.hidden=false;w.className='why '+(ok?'good':'bad');\n    w.textContent=(ok?\"✔ To'g'ri! \":\"✘ Aksincha. \")+s[2]};\n  $('#f-obj',R).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;key=b.dataset.k;$$('#f-obj .chip',R).forEach(x=>x.classList.toggle('on',x===b));lp.stop();reset()};\n  $('#f-go',R).onclick=()=>{if(st.fin)reset();lp.start()};\n  $('#f-pause',R).onclick=()=>lp.stop();\n  $('#f-reset',R).onclick=()=>{lp.stop();reset()};\n  reset();\n}\n\n/* =====================================================\n   4. GIPOTEZA\n   ===================================================== */\nfunction initS4(){\n  const R=$('#sim4');\n  const HYP={L1:\"Mayatnik uzunligi ortsa, davr ham ortadi (sekinroq tebranadi).\",L2:\"Mayatnik uzunligi ortsa, davr kamayadi (tezroq tebranadi).\",L3:\"Uzunlik davrga ta'sir qilmaydi.\",\n    M1:\"Sharcha massasi ortsa, davr ortadi.\",M2:\"Sharcha massasi ortsa, davr kamayadi.\",M3:\"Massa davrga ta'sir qilmaydi.\"};\n  const radios=ks=>ks.map(k=>`\u003clabel class=\"opt\">\u003cinput type=\"radio\" name=\"hyp\" value=\"${k}\">${HYP[k]}\u003c/label>`).join('');\n  R.innerHTML=`\n  \u003cp class=\"lb ik (sm)\u003c/th>\u003cth>Massa (g)\u003c/th>\u003cth>10 tebranish (s)\u003c/th>\u003cth>Davr T (s)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"p-rows\">\u003ctr>\u003ctd colspan=\"4\">Hali o'lchov yo'q.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"btns\">\u003cbutton class=\"btn ghost\" id=\"p-clear\">Jadvalni tozalash\u003c/button>\u003c/div>\n  \u003cp class=\"lbl\">3-qadam. Natijani tahlil qil\u003c/p>\n  \u003cbutton class=\"btn alt\" id=\"h-check\">Gipotezani tekshirish\u003c/button>\n  \u003cdiv class=\"msg\" id=\"h-res\" hidden aria-live=\"polite\">\u003c/div>`;\n  const cv=$('#p-cv',R),ctx=canvasSetup(cv,720,380);\n  let L=60,m=100,speed=3,ts=0,cnt=0;const rows=[];const A=12*Math.PI/180;\n  const T0=()=>2*Math.PI*Math.sqrt(L/100/9.81);\n  function draw(){const c=ctx,ink=cssv('--ink'),edge=cssv('--edge'),col=cssv('--c');c.clearRect(0,0,720,380);\n    const px=L*3.2,rb=10+m/200*12,th=A*Math.cos(2*Math.PI*ts/T0()),x=360+px*Math.sin(th),y=30+px*Math.cos(th);\n    c.strokeStyle=edge;c.lineWidth=8;c.lineCap='round';c.beginPath();c.moveTo(260,30);c.lineTo(460,30);c.stroke();\n    c.setLineDash([6,6]);c.lineWidth=1.5;c.strokeStyle=cssv('--soft');c.beginPath();c.moveTo(360,30);c.lineTo(360,30+px+30);\n    [-A,A].forEach(a=>{c.moveTo(360,30);c.lineTo(360+(px+30)*Math.sin(a),30+(px+30)*Math.cos(a))});c.stroke();c.setLineDash([]);\n    c.strokeStyle=ink;c.lineWidth=3;c.beginPath();c.moveTo(360,30);c.lineTo(x,y);c.stroke();\n    c.fillStyle=col;c.strokeStyle=edge;c.lineWidth=3;c.beginPath();c.arc(x,y,rb,0,7);c.fill();c.stroke();\n    c.fillStyle=ink;c.font=\"800 16px Nunito,sans-serif\";c.fillText(`Uzunlik: ${L} sm`,16,30);c.fillText(`Massa: ${m} g`,16,54);\n    $('#p-t',R).textContent=ts.toFixed(1);$('#p-n',R).textContent=Math.min(10,cnt)}\n  function rowsHtml(){const tb=$('#p-rows',R);if(!rows.length){tb.innerHTML='\u003ctr>\u003ctd colspan=\"4\">Hali o\\'lchov yo\\'q.\u003c/td>\u003c/tr>';return}\n    tb.innerHTML=rows.map(r=>`\u R)||{}).value,res=$('#h-res',R);res.hidden=false;\n    if(!h){res.className='msg bad';res.textContent=\"Avval yuqoridan gipoteza tanla.\";return}\n    const isL=h[0]==='L',eff=isL?lenEffect():massEffect(),want={1:'up',2:'down',3:'none'}[h[1]];\n    if(!eff){res.className='msg';res.textContent=isL?\"Ma'lumot yetarli emas. Kamida ikki xil uzunlikda (farqi 20 sm dan kam bo'lmasin) o'lcha.\":\"Ma'lumot yetarli emas. Massani o'zgartirib (50, 100, 200 g) ham o'lcha.\";return}\n    const ok=eff.e===want;let det='';\n    if(isL)det=` (${eff.lo} sm da T ≈ ${eff.a.toFixed(2)} s, ${eff.hi} sm da T ≈ ${eff.b.toFixed(2)} s)`;\n    else det=eff.e==='none'?\" (massa turlicha bo'lsa ham davr deyarli bir xil chiqdi)\":\"\";\n    res.className='msg '+(ok?'good':'bad');\n    res.innerHTML=ok?`✔ Tajriba natijalari gipotezani tasdiqladi${det}. Gipotezani \u003cb>qabul qilamiz\u003c/b>. Endi yangi savol berib ko'ramiz: massa ta'sir qiladimi?`\n      :`✘ Natijalar gipotezaga zid${det}. Gipotezani \u003cb>rad etamiz\u003c/b>. Bu xato emas, yangi bilim! Endi yangi gipoteza taklif qil va yana tekshir.`;\n    $('#h-m',R).hidden=false;$('#h-l',R).hidden=false}\n}\n\n/* =====================================================\n   5. REJALASHTIRISH\n   ===================================================== */\nfunction initS5(){\n  const R=$('#sim5');\n  const GOALS=[[\"Metall va chinni idishdagi issiq suvning sovish tezligini solishtirish\",1,\"Maqsad aniq: nimani nima bilan solishtirishimiz ko'rinib turibdi.\"],\n   [\"Suvni sovutish\",0,\"Bu juda umumiy: nimani nima bilan solishtirish noma'lum.\"],\n   [\"Hamma idishlar bir xil soviydi\",0,\"Bu maqsad emas, gipoteza (taxmin).\"],\n   [\"Qaysi idish chiroyliroq ekanini bilish\",0,\"Bu fizik tadqiqot maqsadi emas, chunki uni o'lchab bo'lmaydi.\"]];\n  const CATS={c:\"O'zgaradi\",s:\"O'zgarmaydi\",m:\"O'lchanadi\"};\n  const VARS=[[\"Idish materiali (metall yoki chinni)\",'c'],[\"Suv miqdori (ml)\",'s'],[\"Suvning boshlang'ich harorati\",'s'],[\"Xona harorati\",'s'],[\"Suv harorati (har 2 daqiqada)\",'m'],[\"Vaqt (daqiqa)\",'m']];\n  const TOOLS=[[\"Termometr\",1],[\"Sekundomer\",1],[\"O'lchov stakani (menzurka)\",1],[\"Metall va chinni idish\",1],[\"Issiq suv\",1],[\"Kompas\",0],[\"Chizg'ich\",0],[\"Magnit\",0]];\n  const ORDER=[\"Ikkala idishga bir xil miqdorda (masalan, 200 ml) issiq suv quyaman\",\"Ikkala idishga termometr tushirib, boshlang'ich haroratni yozaman\",\"Sekundomerni ishga tushiraman\",\"Har 2 daqiqada ikkala idish haroratini o'lchab, jadvalga yozaman\",\"10 daqiqadan so'ng o'lchashni to'xtataman\",\"Jadval yoki grafik tuzib, xulosa chiqaraman\"];\n  const NAMES=[\"Maqsad\",\"O'zgaruvchilar\",\"Asboblar\",\"Bosqichlar\"];\n  let cur=0,goal=null,vsel={},tsel=new Set(),ord=[],okStep=false;\n  function ordInit(){do{ord=shuffle(ORDER.map((_,i)=>i))}while(ord.every((v,i)=>v===i))}\n  ordInit();\n  R.innerHTML=`\u003cp>\u003cb>Muammo:\u003c/b> bir xil issiq suv quyilgan metall va chinni idishlardan qaysi biri tezroq soviydi? Tadqiqot rejasini 4 bosqichda tuz.\u003c/p>\u003col class=\"stepper\" id=\"pl-st\">\u003c/ol>\u003cdiv id=\"pl-body\">\u003c/div>`;\n  function stepper(){$('#pl-st',R).innerHTML=NAMES.map((n,i)=>`\u003cli class=\"${i===cur?'act':i\u003ccur?'dn':''}\">${i+1}. ${n}\u003c/li>`).join('')}\n  function nextBtn(){return `\u003cdiv class=\"btns\">\u003cbutton class=\"btn alt\" id=\"pl-next\">${cur\u003c3?'Keyingi bosqich':'Rejani ko\\'rish'}\u003c/button>\u003c/div>`}\n  function render(){stepper();const B=$('#pl-body',R);okStep=false;\n    if(cur===0){B.innerHTML=`\u003cp class=\"lbl\">1-bosqich. Tadqiqotning maqsadini qaysi gap to'g'ri ifodalaydi?\u003c/p>`+GOALS.map((g,i)=>`\u003cbutton class=\"opt\" data-g=\"${i}\">${g[0]}\u003c/button>`).join('')+`\u003cp class=\"why\" id=\"pl-fb\" hidden>\u003c/p>`}\n    if(cur===1){B.innerHTML=`\u003cp class=\"lbl\">2-bosqich. Har bir kattalik qanday bo'lishi kerak?\u003c/p>`+VARS.map((v,i)=>`\u003cdiv class=\"vrow\" data-i=\"${i}\">\u003cspan class=\"t\">${v[0]}\u003c/span>\u003cspan class=\"btns\" style=\"margin:0\">${Object.keys(CATS).map(k=>`\u003cbutton class=\"chip${vsel[i]===k?' on':''}\" data-k=\"${k}\">${CATS[k]}\u003c/button>`).join('')}\u003c/span>\u003c/div>`).join('')+`\u003cdiv class=\"btns\">\u003cbutton class=\"btn\" id=\"pl-chk\">Tekshirish\u003c/button>\u003c/div>\u003cp class=\"msg\" id=\"pl-fb\" hidden>\u003c/p>`}\n    if(cur===2){B.innerHTML=`\u003cp class=\"lbl\">3-bosqich. Bu tajriba uchun kerakli jihoz va asboblarni tanla:\u003c/p>\u003cdiv class=\"btns\" id=\"pl-tools\">${TOOLS.map((t,i)=>`\u003cbutton class=\"chip${tsel.has(i)?' on':''}\" data-t=\"${i}\" aria-pressed=\"${tsel.has(i)}\">${t[0]}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"btns\">\u003cbutton class=\"btn\" id=\"pl-chk\">Tekshirish\u003c/button>\u003c/div>\u003cp class=\"msg\" id=\"pl-fb\" hidden>\u003c/p>`}\n    if(cur===3){B.innerHTML=`\u003cp class=\"lbl\">4-bosqich. Tajriba bosqichlarini to'g'ri tartibga sol (strelkalar bilan):\u003c/p>\u003cdiv id=\"pl-ord\">${ord.map((k,p)=>`\u003cdiv class=\"vrow\" data-p=\"${p}\">\u003cspan class=\"t\">${ORDER[k]}\u003c/span>\u003cspan class=\"btns\" style=\"margin:0\">\u003cbutton class=\"chip\" data-mv=\"-1\" aria-label=\"Yuqoriga\">▲\u003c/button>\u003cbutton class=\"chip\" data-mv=\"1\" aria-label=\"Pastga\">▼\u003c/button>\u003c/span>\u003c/div>`).join('')}\u003c/div>\u003cdiv class=\"btns\">\u003cbutton class=\"btn\" id=\"pl-chk\">Tekshirish\u003c/button>\u003c/div>\u003cp class=\"msg\" id=\"pl-fb\" hidden>\u003c/p>`}\n    if(cur===4){B.innerHTML=`\u003cdiv class=\"card\" style=\"margin:0\">\u003ch3>Mening tajriba rejam\u003c/h3>\u003cp>\u003cb>Muammo:\u003c/b> qaysi idish tezroq soviydi?\u003c/p>\u003cp>\u003cb>Maqsad:\u003c/b> ${GOALS[0][0]}.\u003c/p>\u003cp>\u003cb>O'zgaradigan:\u003c/b> idish materiali.\u003c/p>\u003cp>\u003cb>O'zgarmas:\u003c/b> suv miqdori, boshlang'ich harorat, xona harorati.\u003c/p>\u003cp>\u003cb>O'lchanadigan:\u003c/b> suv harorati va iss} ta kattalik tanlanmagan.`,0)}else if(bad){fb(`${bad} ta javob noto'g'ri (qizil). Maslahat: solishtirilayotgan narsa o'zgaradi, adolat uchun qolgan sharoitlar o'zgarmas, natijani ko'rsatuvchi kattaliklar o'lchanadi.`,0)}else{fb(\"✔ Ajoyib! Faqat bitta kattalik (idish materiali) o'zgaradi, shuning uchun tajriba adolatli.\",1);ok()}}\n      if(cur===2){const need=TOOLS.map((x,i)=>x[1]?i:-1).filter(i=>i>=0),miss=need.filter(i=>!tsel.has(i)).length,extra=[...tsel].filter(i=>!TOOLS[i][1]).map(i=>TOOLS[i][0]);\n        if(!miss&&!extra.length){fb(\"✔ To'g'ri! Harorat, vaqt va suv miqdorini o'lchash uchun aynan shular kerak.\",1);ok()}\n        else fb(`${miss?`Yana ${miss} ta kerakli jihoz yetishmayapti. `:''}${extra.length?`Keraksiz: ${extra.join(', ')}. Ular bu tajribada hech qanday kattalikni o'lchashga yordam bermaydi.`:''}`,0)}\n      if(cur===3){let bad=0;$$('#pl-ord .vrow',R).forEach((r,p)=>{r.classList.remove('ok','no');if(ord[p]===p)r.classList.add('ok');else{r.classList.add('no');bad++}});\n        if(bad)fb(`${bad} ta bosqich o'z o'rnida emas (qizil). Avval tayyorgarlik, keyin o'lchash, oxirida tahlil.`,0);else{fb(\"✔ Tartib to'g'ri!\",1);ok()}}}};\n  render();\n}\n\n/* =====================================================\n   6. O'LCHASH\n   ===================================================== */\nfunction initS6(){\n  const R=$('#sim6'),rows=[];\n  R.innerHTML=`\n  \u003cdiv class=\"btns\" id=\"m-seg\">\u003cbutton class=\"chip on\" data-p=\"a\">🌡 Termometr\u003c/button>\u003cbutton class=\"chip\" data-p=\"b\">⏱ Sekundomer\u003c/button>\u003cbutton class=\"chip\" data-p=\"c\">⚖ Tarozi\u003c/button>\u003c/div>\n  \u003cdiv id=\"pa\" class=\"two\">\n    \u003cdiv class=\"stage\">\u003csvg id=\"th-svg\" viewBox=\"0 0 220 420\" role=\"img\" aria-label=\"Termometr\">\u003c/svg>\u003c/div>\n    \u003cdiv>\u003cp>Suv isitilmoqda. \u003cb id=\"th-min\">0\u003c/b>-daqiqa.\u003c/p>\n      \u003cp class=\"say\">Simob ustuni uchi qaysi chiziqqa to'g'ri kelishini o'q <script>
(function(){
