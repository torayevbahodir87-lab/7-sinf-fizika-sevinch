gba(6,167,125,.25), transparent 45%),\n      var(--ink);\n    color:#FFF9EF;\n    padding:56px 0 64px;\n    position:relative;\n    overflow:hidden;\n  }\n  .hero .wrap{position:relative; z-index:2;}\n  .hero .kicker{\n    font-family:'Baloo 2';\n    font-size:.95rem;\n    color:var(--yellow);\n    font-weight:600;\n    margin-bottom:10px;\n  }\n  .hero h1{\n    color:#fff;\n    font-size:clamp(1.9rem, 6vw, 2.7rem);\n    line-height:1.15;\n    max-width:11ch;\n  }\n  .hero p{\n    color:#D8D6E8;\n    max-width:46ch;\n    font-size:1.05rem;\n  }\n  #heroCanvas{\n    display:block;\n    width:100%;\n    height:150px;\n    margin-top:24px;\n    border-radius:14px;\n    background:rgba(255,255,255,0.04);\n  }\n\n  /* ---------- SECTION SHELL ---------- */\n  section.topic{\n    padding:52px 0 40px;\n    border-bottom:1px solid var(--line);\n  }\n  .topic-head{\n    display:flex;\n    align-items:flex-start;\n    gap:14px;\n    margin-bottom:6px;\n  }\n  .topic-badge{\n    flex:0 0 auto;\n    width:46px; height:46px;\n    border-radius:12px;\n    display:flex; align-items:center; justify-content:center;\n    font-size:1.4rem;\n    color:#fff;\n  }\n  .mech .topic-badge{background:var(--mech);}\n  .mol .topic-badge{background:var(--mol);}\n  .therm .topic-badge{background:var(--hot);}\n\n  .topic h2{font-size:1.5rem;}\n\n  .question-bubble{\n    display:inline-block;\n    font-family:'Baloo 2';\n    font-weight:600;\n    font-size:1.05rem;\n    padding:10px 16px;\n    border-radius:14px 14px 14px 2px;\n    margin:14px 0 18px;\n  }\n  .mech .question-bubble{background:var(--mech-bg); color:var(--mech-dark);}\n  .mol .question-bubble{background:var(--mol-bg); color:var(--mol-dark);}\n  .therm .question-bubble{background:var(--therm-bg); color:var(--hot);}\n\n  .theory{color:var(--ink-soft); margin-bottom:22px;}\n  .theory b{color:var(--ink); font-weight:800;}\n\n  /* ---------- SIM CARD ---------- */\n  .sim-card{\n    border-radius:20px;\n    padding:18px 18px 22px;\n    box-shadow:var(--card-shadow);\n    border:2px solid var(--ink);\n    margin-bottom:22px;\n  }\n  .mech .sim-card{background:var(--mech-bg); box-shadow:6px 6px 0 var(--mech-dark);}\n  .mol .sim-card{background:var(--mol-bg); box-shadow:6px 6px 0 var(--mol-dark);}\n  .therm .sim-card{background:var(--therm-bg); box-shadow:6px 6px 0 var(--hot);}\n\n  .sim-card canvas{\n    width:100%;\n    display:block;\n    border-radius:12px;\n    background:#FFFFFF;\n    touch-action:none;\n  }\n  .sim-controls{\n    display:flex;\n    flex-wrap:wrap;\n    align-items:center;\n    gap:10px 16px;\n    margin-top:14px;\n  }\n  .sim-controls label{\n    font-family:'Baloo 2';\n    font-weight:600;\n    font-size:.92rem;\n    display:flex;\n    align-items:center;\n    gap:8px;\n  }\n  input[type=range]{\n    -webkit-appearance:none;\n    width:140px;\n    height:6px;\n    border-radius:4px;\n    background:rgba(27,27,47,.18);\n    outline:none;\n  }\n  input[type=range]::-webkit-slider-thumb{\n    -webkit-appearance:none;\n    width:20px; height:20px;\n    border-radius:50%;\n    background:var(--ink);\n    border:3px solid #fff;\n    cursor:pointer;\n  }\n  input[type=range]::-moz-range-thumb{\n    width:20px; height:20px;\n    border-radius:50%;\n    background:var(--ink);\n    border:3px solid #fff;\n    cursor:pointer;\n  }\n  .btn{\n    font-family:'Baloo 2';\n    font-weight:600;\n    font-size:.92rem;\n    border:2px solid var(--ink);\n    background:#fff;\n    color:var(--ink);\n    padding:8px 16px;\n    border-radius:10px;\n    cursor:pointer;\n    transition:transform .08s ease;\n  }\n  .btn:active{transform:translateY(2px);}\n  .btn.primary{background:var(--ink); color:#FFF9EF;}\n  .btn.on{background:var(--yellow); border-color:var(--ink);}\n  .readout{\n    font-family:'Baloo 2';\n    font-weight:700;\n    font-size:.92rem;\n    margin-left:auto;\n    background:#fff;\n    padding:6px 12px;\n    border-radius:8px;\n    border:2px solid var(--ink);\n  }\n\n  /* ---------- EXAMPLES ---------- */\n  .examples{\n    display:grid;\n    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));\n    gap:12px;\n  }\n  .example{\n    background:var(--paper-2);\n    border-radius:14px;\n    padding:14px 16px;\n    border:1.5px solid var(--line);\n    font-size:.95rem;\n  }\n  .example .em{font-size:1.4rem; display:block; margin-bottom:6px;}\n\n  /* ---------- QUIZ ---------- */\n  .quiz{\n    padding:52px 0 70px;\n    background:var(--ink);\n    color:#FFF9EF;\n  }\n  .quiz .wrap > .qhead{margin-bottom:26px;}\n  .quiz h2{color:#fff; font-size:1.6rem;}\n  .quiz p.sub{color:#C9C7DA; margin-top:6px;}\n  .qcard{\n    background:#26263C;\n    border-radius:16px;\n    padding:18px 18px 16px;\n    margin-bottom:16px;\n  }\n  .qcard .qtext{\n    font-family:'Baloo 2';\n    font-weight:600;\n    font-size:1.02rem;\n    margin-bottom:12px;\n    color:#FFF9EF;\n  }\n  .opts{display:flex; flex-direction:column; gap:8px;}\n  .opt{\n    text-align:left;\n    background:#33334F;\n    color:#EDEBF7;\n    border:2px solid transparent;\n    border-radius:10px;\n    padding:10px 14px;\n    font-family:'Nunito';\n    font-size:.96rem;\n    font-weight:600;\n    cursor:pointer;\n  }\n  .opt:hover:not(:disabled){border-color:var(--yellow);}\n  .opt.correct{background:#0F5C43; border-color:#3ED598; color:#fff;}\n  .opt.wrong{background:#6E2436; border-color:#FF6B7E; color:#fff;}\n  .opt:disabled{cursor:default; opacity:.85;}\n  .score{\n    text-align:center;\n    font-family:'Baloo 2';\n    font-size:1.1rem;\n    margin-top:22px;\n    color:var(--yellow);\n  }\n\n  footer{\n    text-align:center;\n    padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px));\n    color:var(--ink-soft);\n    font-size:.85rem;\n    background:var(--paper);\n  }\n\n  @media (prefers-reduced-motion: reduce){\n    * { animation-duration: 0.001ms !important; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"hero\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"kicker\">7-SINF · FIZIKA\u003c/div>\n    \u003ch1>Fizika fani nimani o'rganadi?\u003c/h1>\n    \u003cp>Atrofimizda har kuni sodir bo'ladigan voqealarning sirini ochamiz: nega to'p sakraydi, nega choy soviydi, nega hid xonaga tarqaladi. Har bir bo'limni o'zing boshqarib ko'r!\u003c/p>\n    \u003ccanvas id=\"heroCanvas\">\u003c/canvas>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain>\n\n  \u003c!-- ============ BO'LIM 1: MEXANIKA ============ -->\n  \u003csection class=\"topic mech\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"topic-head\">\n        \u003cdiv class=\"topic-badge\">🏎️\u003c/div>\n        \u003ch2>Mexanik hodisalar\u003c/h2>\n      \u003c/div>\n      \u003cdiv class=\"question-bubble\">Nega mashina tezlashadi yoki to'xtaydi?\u003c/div>\n      \u003cp class=\"theory\">Jismning vaqt o'tishi bilan o'rnini o'zgartirishi \u003cb>mexanik harakat\u003c/b> deyiladi. Harakat qanchalik tez borayotganini \u003cb>tezlik\u003c/b> ko'rsatadi. Jismni tezlatish, sekinlatish yoki yo'nalishini o'zgartirish uchun unga \u003cb>kuch\u003c/b> ta'sir etishi kerak — kuch bo'lmasa, harakat ham o'zgarmaydi.\u003c/p>\n\n      \u003cdiv class=\"sim-card\">\n        \u003ccanvas id=\"mechCanvas\" width=\"640\" height=\"200\">\u003c/canvas>\n        \u003cdiv class=\"sim-controls\">\n          \u003clabel>🚗 Tezlik\n            \u003cinput type=\"range\" id=\"mechSpeed\" min=\"1\" max=\"10\" value=\"4\" step=\"1\">\n          \u003c/label>\n          \u003cbutton class=\"btn primary\" id=\"mechPush\">⚡ Kuch bilan itarish\u003c/button>\n          \u003cspan class=\"readout\" id=\"mechReadout\">4 birlik/s\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"examples\">\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🚙\u003c/span>Mashina yo'lda tezlashganda va tormoz bosilganda kuch ta'sirini his qilasiz.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">⚽\u003c/span>To'pni tepganingizda u kuch ta'sirida tezlanadi va havoda uchadi.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🚲\u003c/span>Velosipedni tez haydash uchun oyoq bilan ko'proq kuch berishingiz kerak.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ BO'LIM 2: MOLEKULYAR ============ -->\n  \u003csection class=\"topic mol\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"topic-head\">\n        \u003cdiv class=\"topic-badge\">💧\u003c/div>\n        \u003ch2>Molekulyar fizik hodisalar\u003c/h2>\n      \u003c/div>\n      \u003cdiv class=\"question-bubble\">Nega muz qattiq-yu, suv oquvchan, bug' esa tarqaladi?\u003c/div>\n      \u003cp class=\"theory\">Har qanday modda ko'zga ko'rinmas mayda zarrachalar — \u003cb>molekulalardan\u003c/b> tuzilgan. Qattiq jismda molekulalar bir-biriga zich yopishib, faqat titraydi. Suyuqlikda ular erkinroq siljiydi. Gazda esa juda tez va tartibsiz harakatlanadi. Harorat oshganda molekulalar tezroq harakatlanadi!\u003c/p>\n\n      \u003cdiv class=\"sim-card\">\n        \u003ccanvas id=\"molCanvas\" width=\"640\" height=\"220\">\u003c/canvas>\n        \u003cdiv class=\"sim-controls\">\n          \u003cbutton class=\"btn on\" id=\"stateSolid\" data-state=\"solid\">🧊 Qattiq\u003c/button>\n          \u003cbutton class=\"btn\" id=\"stateLiquid\" data-state=\"liquid\">💧 Suyuq\u003c/button>\n          \u003cbutton class=\"btn\" id=\"stateGas\" data-state=\"gas\">💨 Gaz\u003c/button>\n          \u003clabel>🌡️ Harorat\n            \u003cinput type=\"range\" id=\"molTemp\" min=\"1\" max=\"10\" value=\"3\">\n          \u003c/label>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"examples\">\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🌸\u003c/span>Gul hidi butun xonaga tarqaladi — bu hid molekulalarining havoda diffuziyasi.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🍵\u003c/span>Choyga solingan shakar asta-sekin erib, butun stakanga tarqaladi.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">👃\u003c/span>Ovqat pishayotganda hidi butun uyga tarqalib, boshqa xonadan ham sezasiz.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ BO'LIM 3: TERMODINAMIK ============ -->\n  \u003csection class=\"topic therm\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"topic-head\">\n        \u003cdiv class=\"topic-badge\">🔥\u003c/div>\n        \u003ch2>Termodinamik hodisalar\u003c/h2>\n      \u003c/div>\n      \u003cdiv class=\"question-bubble\">Nega issiq choy stakanini ushlasangiz, qo'lingiz isiydi?\u003c/div>\n      \u003cp class=\"theory\">Jismning qanchalik issiq yoki sovuqligini \u003cb>harorat\u003c/b> ko'rsatadi. Issiq jism sovuq jismga tegib tursa, \u003cb>issiqlik\u003c/b> har doim issiqdan sovuqqa o'tadi — ular haroratlari tenglashguncha. Bu jarayonda energiya bir joydan ikkinchisiga almashadi.\u003c/p>\n\n      \u003cdiv class=\"sim-card\">\n        \u003ccanvas id=\"thermCanvas\" width=\"640\" height=\"220\">\u003c/canvas>\n        \u003cdiv class=\"sim-controls\">\n          \u003cbutton class=\"btn primary\" id=\"thermStart\">🔗 Bir-biriga tekkizish\u003c/button>\n          \u003cbutton class=\"btn\" id=\"thermReset\">↺ Qaytadan boshlash\u003c/button>\n          \u003cspan class=\"readout\" id=\"thermReadout\">Issiq: 90° · Sovuq: 10°\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"examples\">\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">☕\u003c/span>Stoldagi issiq choy asta-sekin sovuq havoga issiqlik berib, soviydi.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🧊\u003c/span>Muz stakandagi suyuqlikdan issiqlik olib, erib ketadi.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🥶\u003c/span>Sovuq qo'lni issiq suvga tiqsangiz, issiqlik suvdan qo'lga o'tib, isiydi.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ TEST ============ -->\n  \u003csection class=\"quiz\" id=\"quiz\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"qhead\">\n        \u003ch2>Bilimingni tekshir! 🧠\u003c/h2>\n        \u003cp class=\"sub\">Har bir savolga javob tanla — natija darhol ko'rinadi.\u003c/p>\n      \u003c/div>\n      \u003cdiv id=\"quizList\">\u003c/div>\n      \u003cdiv class=\"score\" id=\"scoreBox\">\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n\u003c/main>\n\n\u003cfooter>7-sinf fizika · Interaktiv dars sahifasi\u003c/footer>\n\n\u003cscript>\n/* =====================================================\n   UMUMIY YORDAMCHI\n===================================================== */\nfunction fitCanvas(canvas){\n  const ratio = canvas.height / canvas.width;\n  function resize(){\n    const w = canvas.clientWidth || canvas.parentElement.clientWidth;\n    canvas.style.height = (w*ratio) + 'px';\n  }\n  window.addEventListener('resize', resize);\n  resize();\n}\n\n/* =====================================================\n   HERO — sodda zarralar animatsiyasi\n===================================================== */\n(function(){\n  const c = document.getElementById('heroCanvas');\n  const ctx = c.getContext('2d');\n  function setup(){\n    c.width = c.clientWidth * (window.devicePixelRatio||1);\n    c.height = c.clientHeight * (window.devicePixelRatio||1);\n  }\n  setup();\n  window.addEventListener('resize', setup);\n  const colors = ['#FF6B35','#06A77D','#FFC145','#E63950','#3E7FD9'];\n  let pts = Array.from({length:26}, ()=>({\n    x: Math.random(), y: Math.random(),\n    vx:(Math.random()-.5)*0.0025, vy:(Math.random()-.5)*0.0025,\n    r: 2+Math.random()*3.2,\n    col: colors[Math.floor(Math.random()*colors.length)]\n  }));\n  function tick(){\n    const W=c.width,H=c.height;\n    ctx.clearRect(0,0,W,H);\n    pts.forEach(p=>{\n      p.x+=p.vx; p.y+=p.vy;\n      if(p.x\u003c0||p.x>1) p.vx*=-1;\n      if(p.y\u003c0||p.y>1) p.vy*=-1;\n      ctx.beginPath();\n      ctx.arc(p.x*W,p.y*H,p.r*(window.devicePixelRatio||1),0,7);\n      ctx.fillStyle=p.col;\n      ctx.globalAlpha=0.85;\n      ctx.fill();\n    });\n    requestAnimationFrame(tick);\n  }\n  tick();\n})();\n\n/* =====================================================\n   BO'LIM 1 — MEXANIKA: sirpanuvchi mashina\n===================================================== */\n(function(){\n  const canvas = document.getElementById('mechCanvas');\n  fitCanvas(canvas);\n  const ctx = canvas.getContext('2d');\n  const speedSlider = document.getElementById('mechSpeed');\n  const readout = document.getElementById('mechReadout');\n  const pushBtn = document.getElementById('mechPush');\n\n  let x = 40, dir = 1, boost = 0;\n\n  function baseSpeed(){ return parseInt(speedSlider.value,10); }\n  speedSlider.addEventListener('input', ()=>{\n    readout.textContent = baseSpeed() + ' birlik/s';\n  });\n  pushBtn.addEventListener('click', ()=>{ boost = 14; });\n\n  function draw(){\n    const W = canvas.width, H = canvas.height;\n    ctx.clearRect(0,0,W,H);\n\n    // yo'l\n    ctx.fillStyle = '#F3E7D6';\n    ctx.fillRect(0, H-46, W, 46);\n    ctx.strokeStyle = '#fff';\n    ctx.setLineDash([16,14]);\n    ctx.lineWidth = 3;\n    ctx.beginPath();\n    ctx.moveTo(0, H-23); ctx.lineTo(W, H-23);\n    ctx.stroke();\n    ctx.setLineDash([]);\n\n    // harakat\n    let v = (baseSpeed()*1.1) + boost;\n    x += dir*v*0.6;\n    if(boost>0) boost -= 0.35;\n    if(boost\u003c0) boost = 0;\n    if(x > W-70){ x = W-70; dir=-1; }\n    if(x \u003c 20){ x = 20; dir=1; }\n\n    // mashina\n    ctx.save();\n    ctx.translate(x, H-70);\n    if(dir\u003c0){ ctx.scale(-1,1); }\n    ctx.fillStyle = '#FF6B35';\n    roundRect(ctx, 0, 10, 60, 26, 8); ctx.fill();\n    ctx.fillStyle = '#C4491B';\n    roundRect(ctx, 12, -6, 34, 22, 8); ctx.fill();\n    ctx.fillStyle = '#DFF3FF';\n    roundRect(ctx, 16, -2, 26, 14, 4); ctx.fill();\n    ctx.fillStyle = '#1B1B2F';\n    ctx.beginPath(); ctx.arc(12,38,8,0,7); ctx.fill();\n    ctx.beginPath(); ctx.arc(48,38,8,0,7); ctx.fill();\n    ctx.restore();\n\n    // kuch effekti\n    if(boost>0.5){\n      ctx.fillStyle = 'rgba(255,193,69,'+(boost/14)+')';\n      ctx.beginPath();\n      ctx.moveTo(x - dir*8, H-58);\n      ctx.lineTo(x - dir*28, H-64);\n      ctx.lineTo(x - dir*28, H-52);\n      ctx.fill();\n    }\n\n    requestAnimationFrame(draw);\n  }\n  draw();\n})();\n\nfunction roundRect(ctx,x,y,w,h,r){\n  ctx.beginPath();\n  ctx.moveTo(x+r,y);\n  ctx.arcTo(x+w,y,x+w,y+h,r);\n  ctx.arcTo(x+w,y+h,x,y+h,r);\n  ctx.arcTo(x,y+h,x,y,r);\n  ctx.arcTo(x,y,x+w,y,r);\n  ctx.closePath();\n}\n\n/* =====================================================\n   BO'LIM 2 — MOLEKULYAR HOLATLAR\n===================================================== */\n(function(){\n  const canvas = document.getElementById('molCanvas');\n  fitCanvas(canvas);\n  const ctx = canvas.getContext('2d');\n  const tempSlider = document.getElementById('molTemp');\n  const btns = {\n    solid: document.getElementById('stateSolid'),\n    liquid: document.getElementById('stateLiquid'),\n    gas: document.getElementById('stateGas')\n  };\n  let state = 'solid';\n  const N = 42;\n  let particles = [];\n\n  function setState(s){\n    state = s;\n    Object.entries(btns).forEach(([k,b])=> b.classList.toggle('on', k===s));\n    initParticles();\n  }\n  Object.entries(btns).forEach(([k,b])=> b.addEventListener('click', ()=>setState(k)));\n\n  function initParticles(){\n    particles = [];\n    const cols = 7, rows = 6;\n    for(let i=0;i\u003cN;i++){\n      let baseX, baseY;\n      if(state==='gas'){\n        baseX = Math.random(); baseY = Math.random();\n      } else {\n        const c = i % cols, r = Math.floor(i/cols)%rows;\n        baseX = 0.09 + c*(0.82/(cols-1));\n        baseY = 0.12 + r*(0.78/(rows-1));\n      }\n      particles.push({\n        bx: baseX, by: baseY,\n        x: baseX, y: baseY,\n        vx: (Math.random()-.5)*0.002,\n        vy: (Math.random()-.5)*0.002,\n        phase: Math.random()*Math.PI*2\n      });\n    }\n  }\n  initParticles();\n\n  function temp(){ return parseInt(tempSlider.value,10); }\n\n  function step(){\n    const W = canvas.width, H = canvas.height;\n    ctx.clearRect(0,0,W,H);\n\n    // konteyner\n    ctx.strokeStyle = '#B9D9CC';\n    ctx.lineWidth = 3;\n    roundRect(ctx, 8,8, W-16, H-16, 14);\n    ctx.stroke();\n\n    const t = temp();\n    const speedFactor = 0.5 + t*0.55;\n\n    particles.forEach(p=>{\n      if(state==='solid'){\n        p.phase += 0.15*speedFactor;\n        p.x = p.bx + Math.sin(p.phase)*0.004*speedFactor;\n        p.y = p.by + Math.cos(p.phase*1.3)*0.004*speedFactor;\n      } else if(state==='liquid'){\n        p.x += p.vx*speedFactor;\n        p.y += p.vy*speedFactor;\n        p.vx += (Math.random()-.5)*0.0015*speedFactor;\n        p.vy += (Math.random()-.5)*0.0015*speedFactor;\n        p.vx = Math.max(-0.004,Math.min(0.004,p.vx));\n        p.vy = Math.max(-0.004,Math.min(0.004,p.vy));\n        // konteyner ichida saqlash\n        if(p.x\u003c0.06){p.x=0.06; p.vx*=-1;}\n        if(p.x>0.94){p.x=0.94; p.vx*=-1;}\n        if(p.y\u003c0.08){p.y=0.08; p.vy*=-1;}\n        if(p.y>0.92){p.y=0.92; p.vy*=-1;}\n      } else { // gas\n        p.x += p.vx*speedFactor*2.2;\n        p.y += p.vy*speedFactor*2.2;\n        if(p.vx===0) p.vx = (Math.random()-.5)*0.004;\n        if(p.vy===0) p.vy = (Math.random()-.5)*0.004;\n        if(p.x\u003c0.03||p.x>0.97) p.vx*=-1;\n        if(p.y\u003c0.05||p.y>0.95) p.vy*=-1;\n        p.x = Math.max(0.03,Math.min(0.97,p.x));\n        p.y = Math.max(0.05,Math.min(0.95,p.y));\n      }\n\n      ctx.beginPath();\n      ctx.arc(p.x*W, p.y*H, 6.2, 0, 7);\n      ctx.fillStyle = state==='gas' ? '#06A77D' : (state==='liquid' ? '#0E8F72' : '#04735A');\n      ctx.globalAlpha = 0.9;\n      ctx.fill();\n    });\n\n    // gas uchun tezlik ta'minlash (vx/vy random.init bo'lmagani uchun)\n    requestAnimationFrame(step);\n  }\n  // gaz zarralariga boshlang'ich tezlik berish\n  particles.forEach(p=>{ if(p.vx===0) p.vx=0.002; if(p.vy===0) p.vy=0.002; });\n  step();\n})();\n\n/* =====================================================\n   BO'LIM 3 — TERMODINAMIKA: issiqlik almashinuvi\n===================================================== */\n(function(){\n  const canvas = document.getElementById('thermCanvas');\n  fitCanvas(canvas);\n  const ctx = canvas.getContext('2d');\n  const startBtn = document.getElementById('thermStart');\n  const resetBtn = document.getElementById('thermReset');\n  const readout = document.getElementById('thermReadout');\n\n  let hotT = 90, coldT = 10;\n  let touching = false;\n  let done = false;\n\n  function reset(){\n    hotT = 90; coldT = 10; touching = false; done = false;\n    startBtn.disabled = false;\n    updateReadout();\n  }\n  function updateReadout(){\n    readout.textContent = 'Issiq: '+Math.round(hotT)+'° · Sovuq: '+Math.round(coldT)+'°';\n  }\n  startBtn.addEventListener('click', ()=>{ touching = true; startBtn.disabled = true; });\n  resetBtn.addEventListener('click', reset);\n\n  function tempColor(t){\n    // 10 (ko'k) -> 90 (qizil)\n    const ratio = (t-10)/80;\n    const r = Math.round(62 + ratio*(230-62));\n    const g = Math.round(127 + ratio*(57-127));\n    const b = Math.round(217 + ratio*(80-217));\n    return `rgb(${r},${g},${b})`;\n  }\n\n  let particlesHot = Array.from({length:16}, ()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.01,vy:(Math.random()-.5)*.01}));\n  let particlesCold = Array.from({length:16}, ()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.01,vy:(Math.random()-.5)*.01}));\n\n  function moveGroup(list, t){\n    const f = 0.3 + (t/90)*1.6;\n    list.forEach(p=>{\n      p.x += p.vx*f; p.y += p.vy*f;\n      if(p.x\u003c0.05||p.x>0.95) p.vx*=-1;\n      if(p.y\u003c0.08||p.y>0.92) p.vy*=-1;\n      p.x = Math.max(0.05,Math.min(0.95,p.x));\n      p.y = Math.max(0.08,Math.min(0.92,p.y));\n    });\n  }\n\n  function draw(){\n    const W = canvas.width, H = canvas.height;\n    ctx.clearRect(0,0,W,H);\n\n    if(touching && !done){\n      const diff = hotT - coldT;\n      if(diff > 0.5){\n        const flow = diff*0.01;\n        hotT -= flow;\n        coldT += flow;\n      } else {\n        done = true;\n      }\n      updateReadout();\n    }\n\n    const blockW = W*0.36, blockH = H*0.62, gap = touching ? 4 : 26;\n    const y0 = H*0.16;\n    const hotX = W/2 - blockW - gap/2;\n    const coldX = W/2 + gap/2;\n\n    // issiq blok\n    ctx.fillStyle = tempColor(hotT);\n    roundRect(ctx, hotX, y0, blockW, blockH, 16); ctx.fill();\n    moveGroup(particlesHot, hotT);\n    particlesHot.forEach(p=>{\n      ctx.beginPath();\n      ctx.arc(hotX + p.x*blockW, y0 + p.y*blockH, 4, 0, 7);\n      ctx.fillStyle = 'rgba(255,255,255,0.75)';\n      ctx.fill();\n    });\n\n    // sovuq blok\n    ctx.fillStyle = tempColor(coldT);\n    roundRect(ctx, coldX, y0, blockW, blockH, 16); ctx.fill();\n    moveGroup(particlesCold, coldT);\n    particlesCold.forEach(p=>{\n      ctx.beginPath();\n      ctx.arc(coldX + p.x*blockW, y0 + p.y*blockH, 4, 0, 7);\n      ctx.fillStyle = 'rgba(255,255,255,0.75)';\n      ctx.fill();\n    });\n\n    // issiqlik oqimi strelkalari\n    if(touching && !done){\n      const midY = y0 + blockH/2;\n      for(let i=0;i\u003c3;i++){\n        const ox = (Date.now()/300 + i*0.9)%3;\n        const ax = hotX + blockW + 4 + ox*6;\n        ctx.fillStyle = 'rgba(230,57,80,0.7)';\n        ctx.beginPath();\n        ctx.moveTo(ax, midY-8+i*10);\n        ctx.lineTo(ax+10, midY-3+i*10);\n        ctx.lineTo(ax, midY+2+i*10);\n        ctx.fill();\n      }\n    }\n\n    // labels\n    ctx.fillStyle = '#fff';\n    ctx.font = '600 13px Nunito, sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText('ISSIQ', hotX+blockW/2, y0+18);\n    ctx.fillText('SOVUQ', coldX+blockW/2, y0+18);\n\n    requestAnimationFrame(draw);\n  }\n  updateReadout();\n  draw();\n})();\n\n/* =====================================================\n   TEST BO'LIMI\n===================================================== */\nconst quizData = [\n  {\n    q: \"1. Jismning vaqt o'tishi bilan boshqa jismlarga nisbatan o'rnini o'zgartirishi qanday ataladi?\",\n    opts: [\"Mexanik harakat\", \"Diffuziya\", \"Issiqlik almashinuvi\", \"Bug'lanish\"],\n    correct: 0\n  },\n  {\n    q: \"2. Jismni tezlatish yoki sekinlatish uchun nima kerak?\",\n    opts: [\"Rang\", \"Hajm\", \"Kuch\", \"Hid\"],\n    correct: 2\n  },\n  {\n    q: \"3. Gaz holatidagi molekulalar qanday harakatlanadi?\",\n    opts: [\"Umuman harakatlanmaydi\", \"Faqat titraydi\", \"Tez va tartibsiz harakatlanadi\", \"Bir joyda aylanadi\"],\n    correct: 2\n  },\n  {\n    q: \"4. Xonaga sepilgan atir hidining tarqalishiga nima misol bo'ladi?\",\n    opts: [\"Diffuziya\", \"Tortishish kuchi\", \"Issiqlik o'tkazuvchanlik\", \"Tezlanish\"],\n    correct: 0\n  },\n  {\n    q: \"5. Issiq choy stakani sovuq havoda qoldirilsa, issiqlik qaysi tomonga o'tadi?\",\n    opts: [\"Sovuqdan issiqqa\", \"Issiqdan sovuqqa\", \"Issiqlik umuman o'tmaydi\", \"Ikkala tomonga teng\"],\n    correct: 1\n  }\n];\n\nconst quizList = document.getElementById('quizList');\nconst scoreBox = document.getElementById('scoreBox');\nlet answered = 0, correctCount = 0;\n\nquizData.forEach((item, qi)=>{\n  const card = document.createElement('div');\n  card.className = 'qcard';\n  const qtext = document.createElement('div');\n  qtext.className = 'qtext';\n  qtext.textContent = item.q;\n  card.appendChild(qtext);\n\n  const optsWrap = document.createElement('div');\n  optsWrap.className = 'opts';\n\n  item.opts.forEach((optText, oi)=>{\n    const btn = document.createElement('button');\n    btn.className = 'opt';\n    btn.textContent = optText;\n    btn.addEventListener('click', ()=>{\n      const allOpts = optsWrap.querySelectorAll('.opt');\n      allOpts.forEach(o=> o.disabled = true);\n      if(oi === item.correct){\n        btn.classList.add('correct');\n        correctCount++;\n      } else {\n        btn.classList.add('wrong');\n        allOpts[item.correct].classList.add('correct');\n      }\n      answered++;\n      updateScore();\n    });\n    optsWrap.appendChild(btn);\n  });\n\n  card.appendChild(optsWrap);\n  quizList.appendChild(card);\n});\n\nfunction updateScore(){\n  if(answered === quizData.length){\n    scoreBox.textContent = `Natija: ${correctCount} / ${quizData.length} to'g'ri javob 🎉`;\n  } else {\n    scoreBox.textContent = `Javob berilgan savollar: ${answered} / ${quizData.length}`;\n  }\n}\nupdateScore();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Laboratoriya xavfsizligi", "icon": "🦺", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Laboratoriya xavfsizligi — 7-sinf fizika\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --navy:#152238; --navy2:#1e3358; --yellow:#FFC93C; --red:#E4572E;\n  --teal:#2A9D8F; --cream:#F7F4EC; --ink:#152238; --card:#ffffff;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n*{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5}\nh1,h2,h3{font-family:'Poppins',sans-serif;margin:0 0 .4em}\nimg{max-width:100%}\n.wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}\nheader{background:var(--navy);color:#fff;padding:28px 16px 20px;text-align:center;\n  border-bottom:6px solid var(--yellow)}\nheader h1{font-size:1.5rem}\nheader p{opacity:.85;margin:0;font-size:.95rem}\nnav.tabs{position:sticky;top:0;z-index:5;display:flex;background:var(--navy2);\n  overflow-x:auto}\nnav.tabs button{flex:1;min-width:110px;background:none;border:none;color:#cdd7ea;\n  padding:12px 6px;font-family:'Poppins',sans-serif;font-weight:600;font-size:.82rem;\n  cursor:pointer;border-bottom:4px solid transparent}\nnav.tabs button.active{color:#fff;border-color:var(--yellow)}\nsection.part{display:none;padding-top:20px;animation:fade .4s ease}\nsection.part.active{display:block}\n@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n.card{background:var(--card);border-radius:14px;padding:18px;margin:14px 0;\n  box-shadow:0 2px 10px rgba(21,34,56,.08)}\n.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}\n.rule{background:#fff;border-radius:12px;padding:12px;text-align:center;\n  border:2px solid #eee2}\n.rule .emoji{font-size:1.8rem;display:block;margin-bottom:6px}\n.compare{display:flex;gap:10px;margin:14px 0}\n.compare .box{flex:1;border-radius:12px;padding:14px;text-align:center;cursor:pointer;\n  transition:transform .15s;border:3px solid transparent;font-size:.9rem}\n.compare .box:active{transform:scale(.97)}\n.compare .good{background:#e6f6f2;border-color:var(--teal)}\n.compare .bad{background:#fdeae4;border-color:var(--red)}\n.compare .box .big{font-size:2.2rem;display:block}\n.compare .result{display:none;margin-top:8px;font-weight:600}\n.compare .box.picked .result{display:block}\n.quiz{margin-top:10px}\n.q{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #eee}\n.q p.qtext{font-weight:600;margin:0 0 8px}\n.opt{display:block;width:100%;text-align:left;background:var(--cream);border:2px solid transparent;\n  border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-family:inherit;font-size:.92rem}\n.opt.correct{background:#d7f3e8;border-color:var(--teal)}\n.opt.wrong{background:#fbdcd3;border-color:var(--red)}\n.opt:disabled{cursor:default}\n.score{font-family:'Poppins';font-weight:700;color:var(--navy);margin-top:8px}\n.sim-steps{display:flex;flex-direction:column;gap:8px;margin:12px 0}\n.sim-steps button{background:var(--teal);color:#fff;border:none;border-radius:10px;\n  padding:10px;font-family:'Poppins';font-weight:600;cursor:pointer}\n.step-box{background:#fff;border-left:5px solid var(--teal);border-radius:8px;\n  padding:12px;margin-top:8px;display:none}\n.step-box.show{display:block;animation:fade .3s}\n.sign-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}\n.sign{background:#fff;border-radius:12px;padding:10px 6px;text-align:center;\n  border:2px solid #eee;cursor:pointer;font-size:.75rem}\n.sign .icon{font-size:1.9rem;display:block;margin-bottom:4px}\n.sign.selected{border-color:var(--yellow);background:#fff8e1}\n.match-wrap{display:flex;flex-direction:column;gap:14px;margin:10px 0}\n.match-col{display:flex;flex-direction:column;gap:8px}\n.match-item{background:#fff;border:2px solid #ddd;border-radius:10px;padding:10px;\n  cursor:pointer;font-size:.88rem;text-align:center}\n.match-item.sel{border-color:var(--yellow);background:#fff8e1}\n.match-item.done{border-color:var(--teal);background:#e6f6f2;cursor:default}\nfooter{text-align:center;color:#8a93a6;font-size:.8rem;padding:20px}\n.badge{display:inline-block;background:var(--yellow);color:var(--navy);font-weight:700;\n  border-radius:999px;padding:2px 10px;font-size:.75rem;margin-bottom:8px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003cdiv class=\"badge\">7-SINF · FIZIKA\u003c/div>\n  \u003ch1>Laboratoriya xonasida texnika xavfsizligi\u003c/h1>\n  \u003cp>Bilim — himoya. Har bir qoida — sizning xavfsizligingiz uchun.\u003c/p>\n\u003c/header>\n\n\u003cnav class=\"tabs\">\n  \u003cbutton class=\"active\" onclick=\"showPart(1,this)\">1. Umumiy qoidalar\u003c/button>\n  \u003cbutton onclick=\"showPart(2,this)\">2. Elektr va kimyo\u003c/button>\n  \u003cbutton onclick=\"showPart(3,this)\">3. Ogohlantiruvchi belgilar\u003c/button>\n\u003c/nav>\n\n\u003cdiv class=\"wrap\">\n\n\u003c!-- PART 1 -->\n\u003csection class=\"part active\" id=\"part1\">\n  \u003cdiv class=\"card\">\n    \u003ch2>🔬 Nega qoidalarga rioya qilish shart?\u003c/h2>\n    \u003cp>Laboratoriya — qiziqarli tajribalar xonasi, lekin u o'yin maydonchasi emas. Bu yerda olov, elektr, shisha idishlar va ba'zan kimyoviy moddalar bo'ladi. Bitta e'tiborsizlik — kuyish, kesilish yoki boshqa jarohatga olib kelishi mumkin. Qoidalar seni jazolash uchun emas, balki \u003cb>o'zingni va do'stlaringni asrash\u003c/b> uchun yaratilgan.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch3>📋 Umumiy qoidalar\u003c/h3>\n    \u003cdiv class=\"rule-grid\">\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🥼\u003c/span>Maxsus xalat va himoya vositalarida ishlash\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🙋\u003c/span>O'qituvchi ruxsatisiz asbob ishlatmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🧹\u003c/span>Ish o'rnini toza va tartibli saqlash\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🍎\u003c/span>Laboratoriyada ovqatlanmaslik va ichmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🏃\u003c/span>Yugurmaslik, shovqin qilmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">👂\u003c/span>Xavf sodir bo'lsa, darhol o'qituvchiga aytish\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch3>⚖️ To'g'ri va noto'g'ri xatti-harakat\u003c/h3>\n    \u003cp>Har bir katakchani bosing va natijani ko'ring:\u003c/p>\n    \u003cdiv class=\"compare\">\n      \u003cdiv class=\"box good\" onclick=\"this.classList.add('picked')\">\n        \u003cspan class=\"big\">🙆‍♂️\u003c/span>\n        Qo'llarni yig'ib, o'qituvchi ko'rsatmasini kutish\n        \u003cdiv class=\"result\">✅ To'g'ri! Xavfsiz va tartibli.\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"box bad\" onclick=\"this.classList.add('picked')\">\n        \u003cspan class=\"big\">🙅‍♂️\u003c/span>\n        Ruxsatsiz probirkani qo'lga olib, silkitish\n        \u003cdiv class=\"result\">❌ Noto'g'ri! Sinishi yoki to'kilishi mumkin.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card quiz\" id=\"quiz1\">\n    \u003ch3>✅ Bilimingizni tekshiring (1-qism)\u003c/h3>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- PART 2 -->\n\u003csection class=\"part\" id=\"part2\">\n  \u003cdiv class=\"card\">\n    \u003ch2>⚡ Elektr asboblari bilan ishlash\u003c/h2>\n    \u003cdiv class=\"rule-grid\">\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🔌\u003c/span>Nam qo'l bilan rozetkaga tegmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🧵\u003c/span>Simlar yorilgan bo'lsa ishlatmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🔋\u003c/span>Asbobni ishlatishdan oldin tekshirish\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🛑\u003c/span>Ish tugagach, tokdan uzish\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch2>🧪 Kimyoviy moddalar bilan ishlash\u003c/h2>\n    \u003cdiv class=\"rule-grid\">\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🥽\u003c/span>Himoya ko'zoynagi taqish\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">👃\u003c/span>Moddani hidlash uchun qo'l bilan yelpish\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🚫\u003c/span>Moddani tatib ko'rmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">💧\u003c/span>Kislota-suvni to'g'ri tartibda aralashtirish\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch3>🚑 Baxtsiz hodisa yuz bersa — nima qilish kerak?\u003c/h3>\n    \u003cp>Tugmalarni ketma-ket bosib, to'g'ri harakatni ko'ring:\u003c/p>\n    \u003cdiv class=\"sim-steps\">\n      \u003cbutton onclick=\"showStep('s1')\">1-qadam: Elektr toki urdi\u003c/button>\n      \u003cdiv class=\"step-box\" id=\"s1\">Darhol asbobni rozetkadan uzing (qo'l bilan emas, tugma orqali!) va o'qituvchini chaqiring.\u003c/div>\n      \u003cbutton onclick=\"showStep('s2')\">2-qadam: Kimyoviy modda terga tekkanda\u003c/button>\n      \u003cdiv class=\"step-box\" id=\"s2\">Zararlangan joyni kamida 10-15 daqiqa toza suv bilan yuving va o'qituvchiga darhol xabar bering.\u003c/div>\n      \u003cbutton onclick=\"showStep('s3')\">3-qadam: Har qanday holatda\u003c/button>\n      \u003cdiv class=\"step-box\" id=\"s3\">Vahima qilmang, o'zingiz davolashga urinmang — malakali yordam kelguncha o'qituvchi ko'rsatmasiga amal qiling.\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card quiz\" id=\"quiz2\">\n    \u003ch3>✅ Bilimingizni tekshiring (2-qism)\u003c/h3>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- PART 3 -->\n\u003csection class=\"part\" id=\"part3\">\n  \u003cdiv class=\"card\">\n    \u003ch2>⚠️ Xalqaro xavfsizlik belgilari\u003c/h2>\n    \u003cp>Har bir piktogramma sizga moddaning xavfini oldindan aytadi:\u003c/p>\n    \u003cdiv class=\"sign-grid\" id=\"signGrid\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch3>🎯 Belgini ma'nosi bilan mosla\u003c/h3>\n    \u003cp>Chapdan belgini, o'ngdan mos ta'rifni tanlang.\u003c/p>\n    \u003cdiv class=\"match-wrap\">\n      \u003cdiv class=\"match-col\" id=\"matchLeft\">\u003c/div>\n      \u003cdiv class=\"match-col\" id=\"matchRight\">\u003c/div>\n    \u003c/div>\n    \u003cp id=\"matchMsg\" style=\"font-weight:600;color:var(--teal)\">\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"card quiz\" id=\"quiz3\">\n    \u003ch3>✅ Bilimingizni tekshiring (3-qism)\u003c/h3>\n  \u003c/div>\n\u003c/section>\n\n\u003c/div>\n\u003cfooter>7-sinf fizika · Laboratoriya xavfsizligi darsi\u003c/footer>\n\n\u003cscript>\nfunction showPart(n,btn){\n  document.querySelectorAll('.part').forEach(p=>p.classList.remove('active'));\n  document.getElementById('part'+n).classList.add('active');\n  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));\n  btn.classList.add('active');\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction showStep(id){document.getElementById(id).classList.toggle('show');}\n\nfunction buildQuiz(containerId, questions){\n  const c=document.getElementById(containerId);\n  let score=0, answered=0;\n  questions.forEach((q,qi)=>{\n    const div=document.createElement('div'); div.className='q';\n    const p=document.createElement('p'); p.className='qtext'; p.textContent=(qi+1)+'. '+q.q;\n    div.appendChild(p);\n    q.opts.forEach((opt,oi)=>{\n      const b=document.createElement('button'); b.className='opt'; b.textContent=opt;\n      b.onclick=()=>{\n        if(b.disabled) return;\n        div.querySelectorAll('.opt').forEach(o=>o.disabled=true);\n        if(oi===q.correct){ b.classList.add('correct'); score++; }\n        else{\n          b.classList.add('wrong');\n          div.querySelectorAll('.opt')[q.correct].classList.add('correct');\n        }\n        answered++;\n        updateScore();\n      };\n      div.appendChild(b);\n    });\n    c.appendChild(div);\n  });\n  const scoreEl=document.createElement('p'); scoreEl.className='score'; c.appendChild(scoreEl);\n  function updateScore(){ scoreEl.textContent = 'Natija: '+score+' / '+questions.length+(answered===questions.length? ' 🎉':''); }\n}\n\nbuildQuiz('quiz1',[\n {q:\"Laboratoriyaga kirganda birinchi nima qilish kerak?\",opts:[\"Darhol asboblarni ushlab ko'rish\",\"O'qituvchi ko'rsatmasini tinglash\",\"Do'stlar bilan gaplashish\",\"Telefon bilan band bo'lish\"],correct:1},\n {q:\"Ruxsatsiz asbob ishlatish nimaga olib kelishi mumkin?\",opts:[\"Hech nimaga\",\"Jarohatga\",\"Yaxshi natijaga\",\"Baholarga\"],correct:1},\n {q:\"Laboratoriyada ovqatlanish mumkinmi?\",opts:[\"Ha, doim mumkin\",\"Faqat tanaffusda\",\"Yo'q, mumkin emas\",\"Faqat shirinlik\"],correct:2},\n {q:\"Ish o'rnini qanday saqlash kerak?\",opts:[\"Toza va tartibli\",\"Ahamiyatsiz\",\"Har xil narsalar bilan to'la\",\"Faqat oxirida tozalash\"],correct:0},\n {q:\"Xavfli holat sodir bo'lsa nima qilish kerak?\",opts:[\"Jim turish\",\"Do'stga aytish\",\"Darhol o'qituvchiga xabar berish\",\"O'zi hal qilish\"],correct:2}\n]);\n\nbuildQuiz('quiz2',[\n {q:\"Nam qo'l bilan nimaga tegib bo'lmaydi?\",opts:[\"Daftarga\",\"Rozetkaga\",\"Stulga\",\"Kitobga\"],correct:1},\n {q:\"Simi yorilgan asbobni ishlatish mumkinmi?\",opts:[\"Ha\",\"Yo'q\",\"Faqat ehtiyotkorlik bilan\",\"Faqat tez\"],correct:1},\n {q:\"Ish tugagach, elektr asbobini nima qilish kerak?\",opts:[\"Shunday qoldirish\",\"Rozetkadan uzish\",\"Uyga olib ketish\",\"Sindirish\"],correct:1},\n {q:\"Kimyoviy moddalar bilan ishlaganda nima taqish kerak?\",opts:[\"Qo'lqop va ko'zoynak\",\"Hech narsa\",\"Shlyapa\",\"Qo'lqop shart emas\"],correct:0},\n {q:\"Moddani hidlash uchun to'g'ri usul qaysi?\",opts:[\"Burun bilan yaqin hidlash\",\"Qo'l bilan yelpib hidlash\",\"Tatib ko'rish\",\"Puflash\"],correct:1},\n {q:\"Moddani tatib ko'rish mumkinmi?\",opts:[\"Ha, ozgina\",\"Yo'q, hech qachon\",\"Faqat shirin bo'lsa\",\"Faqat oxirida\"],correct:1},\n {q:\"Elektr toki urganda birinchi harakat nima?\",opts:[\"Odamni ushlab tortish\",\"Asbobni rozetkadan uzish\",\"Suv sepish\",\"Kutib turish\"],correct:1},\n {q:\"Kimyoviy modda teriga tekkanda nima qilish kerak?\",opts:[\"Artib tashlash\",\"Ko'p suv bilan yuvish\",\"Kutish\",\"Ustidan kiyim kiyish\"],correct:1},\n {q:\"Baxtsiz hodisa yuz berganda kim chaqiriladi?\",opts:[\"Do'st\",\"O'qituvchi\",\"Hech kim\",\"Faqat ota-ona\"],correct:1},\n {q:\"O'zingiz davolashga urinish kerakmi?\",opts:[\"Ha, albatta\",\"Yo'q, malakali yordam kutish kerak\",\"Faqat internet orqali\",\"Faqat kitobdan o'qib\"],correct:1}\n]);\n\nbuildQuiz('quiz3',[\n {q:\"Olov belgisi nimani anglatadi?\",opts:[\"Yonuvchan modda\",\"Sovuq modda\",\"Yumshoq modda\",\"Shirin modda\"],correct:0},\n {q:\"Bosh suyagi belgisi nimani bildiradi?\",opts:[\"Foydali modda\",\"Zaharli modda\",\"Yengil modda\",\"Suyuq modda\"],correct:1},\n {q:\"Korroziya belgisini ko'rsangiz, modda qanday?\",opts:[\"Terini/materialni yeyuvchi\",\"Xushbo'y\",\"Yumshoq\",\"Rangsiz\"],correct:0},\n {q:\"Portlash belgisi qachon paydo bo'ladi?\",opts:[\"Modda portlash xavfi bo'lsa\",\"Modda sovuq bo'lsa\",\"Modda shirin bo'lsa\",\"Modda og'ir bo'lsa\"],correct:0},\n {q:\"Ogohlantiruvchi belgini ko'rganda nima qilish kerak?\",opts:[\"E'tibor bermaslik\",\"Ehtiyot bo'lish va qoidaga amal qilish\",\"Modda bilan o'ynash\",\"Uni tashlab yuborish\"],correct:1}\n]);\n\n// Warning signs\nconst signs=[\n {icon:'🔥',label:'Yonuvchan',mean:'Oson alangalanadi, olovdan uzoq tuting'},\n {icon:'☠️',label:'Zaharli',mean:'Yutish yoki nafas olish xavfli'},\n {icon:'🧪',label:'Korroziv',mean:'Terini va materialni yemiradi'},\n {icon:'💥',label:'Portlovchi',label2:'',mean:'Zarba yoki issiqlikdan portlashi mumkin'},\n {icon:'☢️',label:'Radioaktiv',mean:'Nurlanish xavfi bor'},\n {icon:'⚡',label:'Elektr xavfi',mean:'Tok urishi mumkin'}\n];\nconst grid=document.getElementById('signGrid');\nsigns.forEach(s=>{\n  const d=document.createElement('div'); d.className='sign';\n  d.innerHTML='\u003cspan class=\"icon\">'+s.icon+'\u003c/span>'+s.label;\n  grid.appendChild(d);\n});\n\n// Match game\nlet selLeft=null, selRight=null, doneCount=0;\nconst leftCol=document.getElementById('matchLeft');\nconst rightCol=document.getElementById('matchRight');\nconst shuffledRight=[...signs].sort(()=>Math.random()-0.5);\nsigns.forEach((s,i)=>{\n  const l=document.createElement('div'); l.className='match-item'; l.dataset.id=i;\n  l.innerHTML=s.icon+' '+s.label;\n  l.onclick=()=>selectMatch(l,'left',i);\n  leftCol.appendChild(l);\n});\nshuffledRight.forEach(s=>{\n  const idx=signs.indexOf(s);\n  const r=document.createElement('div'); r.className='match-item'; r.dataset.id=idx;\n  r.textContent=s.mean;\n  r.onclick=()=>selectMatch(r,'right',idx);\n  rightCol.appendChild(r);\n});\nfunction selectMatch(el,side,id){\n  if(el.classList.contains('done')) return;\n  if(side==='left'){ if(selLeft) selLeft.classList.remove('sel'); selLeft=el; el.classList.add('sel'); }\n  else{ if(selRight) selRight.classList.remove('sel'); selRight=el; el.classList.add('sel'); }\n  if(selLeft && selRight){\n    if(selLeft.dataset.id===selRight.dataset.id){\n      selLeft.classList.add('done'); selRight.classList.add('done');\n      selLeft.classList.remove('sel'); selRight.classList.remove('sel');\n      doneCount++;\n      selLeft=null; selRight=null;\n      if(doneCount===signs.length){ document.getElementById('matchMsg').textContent='🎉 Barcha belgilar to\\'g\\'ri moslashtirildi!'; }\n    } else {\n      setTimeout(()=>{\n        if(selLeft) selLeft.classList.remove('sel');\n        if(selRight) selRight.classList.remove('sel');\n        selLeft=null; selRight=null;\n      },500);\n    }\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Laboratoriya jihozlari", "icon": "🧪", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>7-sinf fizika — Laboratoriya jihozlari va qurilmalar\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}\nbody{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}\nheader{background:#1d4ed8;color:white;padding:22px;text-align:center}\nh1{margin:0;font-size:28px} h2{margin-top:0}\n.container{max-width:1100px;margin:auto;padding:18px}\n.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}\nbutton{border:1px solid #cbd5e1;background:white;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}\nbutton:hover{background:#e0ecff}\nbutton.active{background:#2563eb;color:white}\n.section{display:none;background:white;border:1px solid #dbe3ee;border-radius:16px;padding:20px;box-shadow:0 4px 14px #0000000d}\n.section.active{display:block}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}\n.card{border:1px solid #dbe3ee;border-radius:14px;padding:15px;background:#fff}\n.icon{font-size:52px;text-align:center;margin:8px}\n.small{color:#64748b;font-size:14px}\n.sim{background:#f8fafc;border-radius:14px;padding:18px;margin-top:15px}\n.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}\ninput[type=range]{width:280px}\n.menzurka{height:280px;width:120px;border:4px solid #475569;border-top:0;border-radius:0 0 20px 20px;margin:15px auto;position:relative;background:#fff}\n.water{position:absolute;bottom:0;left:0;right:0;background:#60a5fa88;border-radius:0 0 15px 15px}\n.menisk{position:absolute;left:7px;right:7px;height:9px;border-radius:50%;background:#3b82f6aa}\n.scale{position:absolute;right:-50px;top:0;height:100%;display:flex;flex-direction:column;justify-content:space-between;font-size:12px}\n.thermo{width:55px;height:240px;border:4px solid #475569;border-radius:30px;margin:15px auto;position:relative}\n.bulb{position:absolute;width:30px;height:30px;border-radius:50%;bottom:7px;left:9px;background:#ef4444}\n.mercury{position:absolute;width:12px;bottom:29px;left:18px;background:#ef4444;border-radius:10px}\n.ruler{height:75px;border:2px solid #475569;margin:25px 0;position:relative;background:repeating-linear-gradient(90deg,#fff 0 9px,#475569 9px 10px)}\n.ruler-label{text-align:center;margin-top:40px;font-size:13px}\n.balance{height:8px;width:240px;background:#475569;margin:70px auto 30px;position:relative}\n.pan{position:absolute;top:12px;width:85px;height:25px;border:2px solid #475569;border-radius:0 0 50px 50px}\n.left{left:0}.right{right:0}\n.stand{width:8px;height:110px;background:#475569;position:absolute;left:50%;top:-45px}\n.big{font-size:28px;font-weight:bold;text-align:center}\n.result{margin-top:12px;padding:12px;background:#e0f2fe;border-radius:10px}\ntable{border-collapse:collapse;width:100%;margin-top:12px}\nth,td{border:1px solid #cbd5e1;padding:9px;text-align:left}\nth{background:#e0ecff}\nol li{margin:8px 0}\nfooter{text-align:center;padding:25px;color:#64748b}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader>\n\u003ch1>🔬 Laboratoriya jihozlari va qurilmalar\u003c/h1>\n\u003cp>7-sinf fizika — interaktiv animatsiya va simulyatsiya\u003c/p>\n\u003c/header>\n\n\u003cdiv class=\"container\">\n\u003cdiv class=\"tabs\">\n\u003cbutton class=\"active\" data-target=\"jihozlar\">🔬 Jihozlar\u003c/button>\n\u003cbutton data-target=\"menzurka\">🥛 Menzurka\u003c/button>\n\u003cbutton data-target=\"aniqlik\">📏 O‘lchash aniqligi\u003c/button>\n\u003cbutton data-target=\"termometr\">🌡️ Termometr\u003c/button>\n\u003cbutton data-target=\"tarozi\">⚖️ Tarozi\u003c/button>\n\u003cbutton data-target=\"sekundomer\">⏱️ Sekundomer\u003c/button>\n\u003cbutton data-target=\"test\">🧠 Tezkor test\u003c/button>\n\u003c/div>\n\n\u003csection id=\"jihozlar\" class=\"section active\">\n\u003ch2>1. Laboratoriya jihozlari\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">🧪\u003c/div>\u003ch3>Probirka\u003c/h3>\u003cp>Kichik miqdordagi moddalar bilan tajriba qilish uchun ishlatiladi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">⚗️\u003c/div>\u003ch3>Kolba\u003c/h3>\u003cp>Suyuqliklarni saqlash, aralashtirish va tajribalar uchun.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">🥛\u003c/div>\u003ch3>Menzurka\u003c/h3>\u003cp>Suyuqlik hajmini o‘lchaydi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">🌡️\u003c/div>\u003ch3>Termometr\u003c/h3>\u003cp>Haroratni o‘lchaydi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">⚖️\u003c/div>\u003ch3>Tarozi\u003c/h3>\u003cp>Massani o‘lchaydi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">↕️\u003c/div>\u003ch3>Dinamometr\u003c/h3>\u003cp>Kuchni nyutonda (N) o‘lchaydi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">⏱️\u003c/div>\u003ch3>Sekundomer\u003c/h3>\u003cp>Vaqt oralig‘ini sekundlarda o‘lchaydi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">🔩\u003c/div>\u003ch3>Shtativ\u003c/h3>\u003cp>Jihozlarni mahkamlab ushlab turadi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">🔻\u003c/div>\u003ch3>Voronka\u003c/h3>\u003cp>Suyuqlikni bir idishdan boshqasiga quyishni osonlashtiradi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">💧\u003c/div>\u003ch3>Pipetka\u003c/h3>\u003cp>Kichik miqdordagi suyuqlikni olish yoki ko‘chirish uchun.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"result\">\u003cb>Eslab qoling:\u003c/b> avval qanday fizik kattalikni o‘lchashingizni aniqlang, keyin mos asbobni tanlang.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"menzurka\" class=\"section\">\n\u003ch2>2. Suyuqlik hajmini o‘lchash simulyatsiyasi\u003c/h2>\n\u003cp>Suyuqlik hajmini menzurka yordamida o‘lchaymiz. Suv kabi suyuqliklarda meniskning pastki qismi o‘qiladi.\u003c/p>\n\u003cdiv class=\"sim\">\n\u003cdiv class=\"menzurka\">\n\u003cdiv id=\"water\" class=\"water\" style=\"height:50%\">\u003c/div>\n\u003cdiv id=\"menisk\" class=\"menisk\" style=\"bottom:50%\">\u003c/div>\n\u003cdiv class=\"scale\">\u003cspan>100 ml\u003c/span>\u003cspan>80\u003c/span>\u003cspan>60\u003c/span>\u003cspan>40\u003c/span>\u003cspan>20\u003c/span>\u003cspan>0\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"big\">\u003cspan id=\"volume\">50\u003c/span> ml\u003c/div>\n\u003cdiv class=\"controls\">\n\u003clabel>Hajm:\u003c/label>\n\u003cinput id=\"volumeRange\" type=\"range\" min=\"0\" max=\"100\" value=\"50\">\n\u003cbutton id=\"readVolume\">📖 O‘lchovni o‘qish\u003c/button>\n\u003c/div>\n\u003cdiv id=\"volumeResult\" class=\"result\">Menzurkani tekis qo‘ying va ko‘zingizni menisk bilan bir balandlikda tuting.\u003c/div>\n\u003c/div>\n\u003ch3>Amaliy qoida\u003c/h3>\n\u003col>\n\u003cli>Menzurkani tekis yuzaga qo‘ying.\u003c/li>\n\u003cli>Suyuqlikni quying.\u003c/li>\n\u003cli>Ko‘zni menisk bilan bir balandlikka keltiring.\u003c/li>\n\u003cli>Meniskning pastki qismidan qiymatni o‘qing.\u003c/li>\n\u003cli>Natijani birlik bilan yozing.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003csection id=\"aniqlik\" class=\"section\">\n\u003ch2>3. O‘lchash aniqligi va bo‘linma qiymati\u003c/h2>\n\u003cp>\u003cb>Bo‘linma qiymati\u003c/b> — shkaladagi qo‘shni belgilar orasidagi qiymat.\u003c/p>\n\u003cdiv class=\"card\">\n\u003ch3>📏 Chizg‘ich animatsiyasi\u003c/h3>\n\u003cdiv class=\"ruler\">\u003c/div>\n\u003cp>\u003cb>Misol:\u003c/b> 0 cm dan 1 cm gacha 10 ta bo‘linma bo‘lsa:\u003c/p>\n\u003cdiv class=\"result\">C = (1 − 0) / 10 = 0,1 cm = \u003cb>1 mm\u003c/b>\u003c/div>\n\u003c/div>\n\u003ctable>\n\u003ctr>\u003cth>Asbob\u003c/th>\u003cth>O‘lchaydigan kattalik\u003c/th>\u003cth>Birlik\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Chizg‘ich\u003c/td>\u003ctd>Uzunlik\u003c/td>\u003ctd>m, cm, mm\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Tarozi\u003c/td>\u003ctd>Massa\u003c/td>\u003ctd>kg, g\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Termometr\u003c/td>\u003ctd>Harorat\u003c/td>\u003ctd>°C, K\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Menzurka\u003c/td>\u003ctd>Hajm\u003c/td>\u003ctd>ml, cm³, l, m³\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Dinamometr\u003c/td>\u003ctd>Kuch\u003c/td>\u003ctd>N\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Sekundomer\u003c/td>\u003ctd>Vaqt\u003c/td>\u003ctd>s\u003c/td>\u003c/tr>\n\u003c/table>\n\u003c/section>\n\n\u003csection id=\"termometr\" class=\"section\">\n\u003ch2>4. Termometr simulyatsiyasi\u003c/h2>\n\u003cdiv class=\"sim\">\n\u003cdiv class=\"thermo\">\n\u003cdiv id=\"mercury\" class=\"mercury\" style=\"height:105px\">\u003c/div>\n\u003cdiv class=\"bulb\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"big\">\u003cspan id=\"temp\">25\u003c/span> °C\u003c/div>\n\u003cdiv class=\"controls\">\n\u003clabel>Harorat:\u003c/label>\n\u003cinput id=\"tempRange\" type=\"range\" min=\"0\" max=\"50\" value=\"25\">\n\u003c/div>\n\u003cdiv class=\"result\">Termometr haroratni o‘lchaydi. O‘lchash natijasi birlik bilan yoziladi, masalan: \u003cb>25 °C\u003c/b>.\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"tarozi\" class=\"section\">\n\u003ch2>5. Massa o‘lchash simulyatsiyasi\u003c/h2>\n\u003cdiv class=\"sim\">\n\u003cdiv style=\"position:relative;height:220px\">\n\u003cdiv class=\"stand\">\u003c/div>\n\u003cdiv class=\"balance\">\n\u003cdiv class=\"pan left\">\u003c/div>\n\u003cdiv class=\"pan right\">\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"big\">\u003cspan id=\"mass\">500\u003c/span> g = \u003cspan id=\"kg\">0.50\u003c/span> kg\u003c/div>\n\u003cinput id=\"massRange\" type=\"range\" min=\"0\" max=\"1000\" value=\"500\" step=\"10\">\n\u003cp class=\"result\">Tarozi yordamida jism massasi aniqlanadi. SI birligi — kilogramm (kg).\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"sekundomer\" class=\"section\">\n\u003ch2>6. Sekundomer animatsiyasi\u003c/h2>\n\u003cdiv class=\"sim\">\n\u003cdiv class=\"big\" id=\"clock\">0.0 s\u003c/div>\n\u003cdiv class=\"controls\" style=\"justify-content:center\">\n\u003cbutton id=\"start\">▶ Boshlash\u003c/button>\n\u003cbutton id=\"stop\">⏸ To‘xtatish\u003c/button>\n\u003cbutton id=\"reset\">↺ Nolga qaytarish\u003c/button>\n\u003c/div>\n\u003cdiv class=\"result\">Sekundomer vaqt oralig‘ini o‘lchaydi. Vaqtning SI birligi — sekund (s).\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"test\" class=\"section\">\n\u003ch2>7. Tezkor interaktiv test\u003c/h2>\n\u003cdiv id=\"quiz\">\u003c/div>\n\u003cbutton id=\"next\">Keyingi savol →\u003c/button>\n\u003cdiv id=\"score\" class=\"result\" style=\"display:none\">\u003c/div>\n\u003c/section>\n\u003c/div>\n\n\u003cfooter>\n\u003cb>7-sinf fizika\u003c/b> • Laboratoriya jihozlari va qurilmalar\u003cbr>\nO‘lchashda: \u003cb>asbobni tanla → to‘g‘ri joylashtir → shkalani o‘qi → birlikni yoz.\u003c/b>\n\u003c/footer>\n\n\u003cscript>\nconst buttons=document.querySelectorAll('.tabs button');\nconst sections=document.querySelectorAll('.section');\nbuttons.forEach(b=>b.addEventListener('click',()=>{\n buttons.forEach(x=>x.classList.remove('active')); b.classList.add('active');\n sections.forEach(s=>s.classList.remove('active'));\n document.getElementById(b.dataset.target).classList.add('active');\n}));\n\nconst vr=document.getElementById('volumeRange');\nvr.addEventListener('input',()=>{\n const v=Number(vr.value);\n document.getElementById('volume').textContent=v;\n document.getElementById('water').style.height=v+'%';\n document.getElementById('menisk').style.bottom=v+'%';\n});\ndocument.getElementById('readVolume').addEventListener('click',()=>{\n const v=vr.value;\n document.getElementById('volumeResult').innerHTML='O‘lchangan hajm: \u003cb>'+v+' ml = '+v+' cm³\u003c/b>. Meniskning pastki qismi bo‘yicha o‘qildi.';\n});\n\nconst tr=document.getElementById('tempRange');\ntr.addEventListener('input',()=>{\n const v=Number(tr.value);\n document.getElementById('temp').textContent=v;\n document.getElementById('mercury').style.height=(25+v*4)+'px';\n});\n\nconst mr=document.getElementById('massRange');\nmr.addEventListener('input',()=>{\n const v=Number(mr.value);\n document.getElementById('mass').textContent=v;\n document.getElementById('kg').textContent=(v/1000).toFixed(2);\n});\n\nlet timer=0,startTime=0,animation=null;\nfunction tick(){\n timer=(performance.now()-startTime)/1000;\n document.getElementById('clock').textContent=timer.toFixed(1)+' s';\n animation=requestAnimationFrame(tick);\n}\ndocument.getElementById('start').onclick=()=>{\n if(!animation){startTime=performance.now()-timer*1000;animation=requestAnimationFrame(tick)}\n};\ndocument.getElementById('stop').onclick=()=>{\n if(animation){cancelAnimationFrame(animation);animation=null}\n};\ndocument.getElementById('reset').onclick=()=>{\n if(animation)cancelAnimationFrame(animation);\n animation=null;timer=0;document.getElementById('clock').textContent='0.0 s';\n};\n\nconst questions=[\n['Suyuqlik hajmini qaysi asbob bilan o‘lchaymiz?',['Menzurka','Dinamometr','Termometr'],'Menzurka'],\n['Kuchning SI birligi nima?',['Nyuton','Kilogramm','Sekund'],'Nyuton'],\n['Massani qaysi asbob o‘lchaydi?',['Tarozi','Termometr','Sekundomer'],'Tarozi'],\n['Vaqtni qaysi asbob o‘lchaydi?',['Sekundomer','Menzurka','Dinamometr'],'Sekundomer'],\n['Haroratni qaysi asbob o‘lchaydi?',['Termometr','Tarozi','Chizg‘ich'],'Termometr']\n];\nlet qi=0,score=0;\nfunction showQuestion(){\n const q=questions[qi];\n document.getElementById('quiz').innerHTML='\u003cdiv class=\"card\">\u003ch3>'+ (qi+1)+'. '+q[0]+'\u003c/h3>'+\n q[1].map((x,i)=>'\u003cbutton class=\"answer\" data-answer=\"'+x+'\">'+x+'\u003c/button>').join(' ')+'\u003c/div>';\n document.querySelectorAll('.answer').forEach(a=>a.onclick=()=>{\n  document.querySelectorAll('.answer').forEach(x=>x.disabled=true);\n  if(a.dataset.answer===q[2]){score++;a.style.background='#bbf7d0'}else{a.style.background='#fecaca'}\n });\n}\nshowQuestion();\ndocument.getElementById('next').onclick=()=>{\n if(qi\u003cquestions.length-1){qi++;showQuestion()}\n else{document.getElementById('score').style.display='block';document.getElementById('score').innerHTML='\u003cb>Natija:\u003c/b> '+score+' / '+questions.length+' ta to‘g‘ri javob.';document.getElementById('next').disabled=true}\n};\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "O'rganish tamoyillari", "icon": "🧠", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Fizika o'rganish tamoyillari\u003c/title>\n\u003cstyle>\n:root{--bg:#fff8ec;--card:#fff;--tx:#2b2540;--mut:#6b6485;--c1:#ff7a59;--c2:#2bb0a0;--c3:#8b5cf6;--ok:#22a55b;--bad:#e5484d;--ln:#eadfcb;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#1c1830;--card:#2a2444;--tx:#f3efff;--mut:#b8b0d6;--ln:#433b66}}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\n.wrap{max-width:820px;margin:0 auto;padding:14px}\nh1{font-size:1.7rem;text-align:center;margin:8px 0 12px}\nh2{margin:0 0 6px;font-size:1.35rem}h3{margin:16px 0 6px;font-size:1.1rem}\n.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}\n.tab{flex:1;border:0;border-radius:14px;padding:10px 4px;font:inherit;font-weight:700;font-size:.85rem;color:#fff;opacity:.55;cursor:pointer}\n.tab.on{opacity:1;box-shadow:0 3px 0 rgba(0,0,0,.25)}\n.t0{background:var(--c1)}.t1{background:var(--c2)}.t2{background:var(--c3)}\n.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:14px;margin:12px 0}\n.sec{display:none}.sec.on{display:block}\ncanvas{width:100%;height:auto;background:#eaf6ff;border-radius:14px;display:block}\nlabel{display:block;margin:6px 0;font-weight:600}\ninput[type=range]{width:100%;height:28px}\nbutton.b{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700;color:#fff;background:var(--c1);cursor:pointer;margin:4px 4px 4px 0}\nbutton.g{background:var(--c2)}button.p{background:var(--c3)}\n.steps{display:flex;gap:6px;flex-wrap:wrap}.st{flex:1;min-width:95px;padding:8px;border-radius:12px;background:var(--bg);border:2px dashed var(--ln);text-align:center;font-size:.85rem;font-weight:700}\n.st.on{border:2px solid var(--c1);background:#fff1e8;color:#2b2540}\n.tblw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid var(--ln);padding:5px;text-align:center}\n.bub{padding:10px 12px;border-radius:16px;margin:8px 0;max-width:88%}\n.az{background:#dbeafe;color:#1e3a5f}.ma{background:#fce7f3;color:#5f1e40;margin-left:auto}\n.opt{display:block;width:100%;text-align:left;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:10px;margin:6px 0;font:inherit;cursor:pointer}\n.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}\n.note{color:var(--mut);font-size:.9rem}.hl{background:#fff4c2;color:#3b3200;border-radius:12px;padding:10px;margin:8px 0}\n.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.fz{border:0;border-radius:16px;padding:14px 8px;font:inherit;font-weight:700;color:#fff;cursor:pointer}\n@media(max-width:420px){body{font-size:17px}.cards{grid-template-columns:1fr}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\u003ch1>🔬 Fizikani o'rganish tamoyillari\u003c/h1>\n\u003cdiv class=\"tabs\">\n\u003cbutton class=\"tab t0 on\" data-t=\"0\">🧪 Tadqiqot\u003c/button>\n\u003cbutton class=\"tab t1\" data-t=\"1\">🤝 Hamkorlik\u003c/button>\n\u003cbutton class=\"tab t2\" data-t=\"2\">🎯 Fazilatlar\u003c/button>\n\u003c/div>\n\n\u003c!-- ============ 1-BO'LIM ============ -->\n\u003csection class=\"sec on\" id=\"s0\">\n\u003cdiv class=\"card\">\u003ch2>🧪 Tadqiqotchi va ijodiy yondashuv\u003c/h2>\n\u003cp>Olim savol beradi, \u003cb>gipoteza\u003c/b> (taxmin) qo'yadi, \u003cb>tajriba\u003c/b> qiladi va \u003cb>xulosa\u003c/b> chiqaradi. Yangi fikrlar ijodkorlikdan boshlanadi!\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"steps\">\u003cdiv class=\"st on\" id=\"st0\">1️⃣ Gipoteza\u003c/div>\u003cdiv class=\"st\" id=\"st1\">2️⃣ Tajriba\u003c/div>\u003cdiv class=\"st\" id=\"st2\">3️⃣ Xulosa\u003c/div>\u003c/div>\n\u003ch3>Savol: massa mayatnik davriga ta'sir qiladimi?\u003c/h3>\n\u003cbutton class=\"b p\" onclick=\"hyp('ha')\">Ha, ta'sir qiladi\u003c/button>\u003cbutton class=\"b p\" onclick=\"hyp('yoq')\">Yo'q, ta'sir qilmaydi\u003c/button>\n\u003cdiv id=\"hypTx\" class=\"note\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ccanvas id=\"cv0\" width=\"360\" height=\"250\">\u003c/canvas>\n\u003clabel>Ip uzunligi: \u003cspan id=\"vL\">1.0\u003c/span> m\u003cinput type=\"range\" id=\"rL\" min=\"0.2\" max=\"2\" step=\"0.1\" value=\"1\">\u003c/label>\n\u003clabel>Yuk massasi: \u003cspan id=\"vM\">1.0\u003c/span> kg\u003cinput type=\"range\" id=\"rM\" min=\"0.1\" max=\"2\" step=\"0.1\" value=\"1\">\u003c/label>\n\u003clabel>Boshlang'ich burchak: \u003cspan id=\"vA\">30\u003c/span>°\u003cinput type=\"range\" id=\"rA\" min=\"5\" max=\"60\" step=\"1\" value=\"30\">\u003c/label>\n\u003cp>⏱ Davr T = \u003cb id=\"tT\">-\u003c/b> s &nbsp; (o'lchangan: \u003cb id=\"tM\">-\u003c/b> s)\u003c/p>\n\u003cbutton class=\"b g\" onclick=\"addRow()\">➕ Jadvalga qo'shish\u003c/button>\u003cbutton class=\"b\" onclick=\"concl()\">📝 Xulosa chiqarish\u003c/button>\n\u003cdiv class=\"tblw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>L (m)\u003c/th>\u003cth>m (kg)\u003c/th>\u003cth>Burchak\u003c/th>\u003cth>T (s)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"tb\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv id=\"conc\" class=\"hl\" style=\"display:none\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>💭 O'ylab ko'r\u003c/h3>\u003cul>\u003cli>Faqat massani o'zgartirsang, T o'zgaradimi?\u003c/li>\u003cli>Ipni 4 marta uzunroq qilsang, T necha marta ortadi?\u003c/li>\u003cli>Nega bitta o'lchovga ishonib bo'lmaydi?\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>✅ Mustahkamlash\u003c/h3>\u003cdiv id=\"q0\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 2-BO'LIM ============ -->\n\u003csection class=\"sec\" id=\"s1\">\n\u003cdiv class=\"card\">\u003ch2>🤝 Hamkorlik, erkin fikrlash va skeptik qarash\u003c/h2>\n\u003cp>\u003cb>Skeptik\u003c/b> — hamma narsaga darhol ishonmay, \"Isboti bormi?\" deb so'raydigan odam. Do'stlar bilan muhokama qilsak, haqiqatga tezroq yetamiz.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv id=\"dlg\">\u003c/div>\u003cbutton class=\"b g\" id=\"dnx\" onclick=\"nextD()\">Keyingi ▶\u003c/button>\u003c/div>\n\u003cdiv class=\"card\">\u003ccanvas id=\"cv1\" width=\"360\" height=\"260\">\u003c/canvas>\n\u003cbutton class=\"b\" onclick=\"drop()\">⬇️ Tushirish\u003c/button>\u003cbutton class=\"b p\" id=\"airB\" onclick=\"toggleAir()\">💨 Havo qarshiligi: O'CHIQ\u003c/button>\n\u003cdiv id=\"res\" class=\"hl\">Natija: tajriba boshlanmagan.\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>💭 O'ylab ko'r\u003c/h3>\u003cul>\u003cli>Havo bo'lmasa, tosh va qog'oz nega birga tushdi?\u003c/li>\u003cli>Aziz noto'g'ri edimi? Nega u ham foydali fikr aytdi?\u003c/li>\u003cli>Do'stingning fikriga qo'shilmasang, qanday muloyim so'raysan?\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>✅ Mustahkamlash\u003c/h3>\u003cdiv id=\"q1\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 3-BO'LIM ============ -->\n\u003csection class=\"sec\" id=\"s2\">\n\u003cdiv class=\"card\">\u003ch2>🎯 Qat'iyat, kamtarlik, rostgo'ylik, mas'uliyat\u003c/h2>\n\u003cp>Har bir o'lchov ozgina xato bilan chiqadi. Shuning uchun ko'p marta o'lchab, \u003cb>o'rtacha qiymat\u003c/b> olamiz.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>📏 Aniq o'lchash o'yini\u003c/h3>\n\u003cbutton class=\"b\" onclick=\"meas('L')\">📏 Qalam uzunligini o'lcha\u003c/button>\u003cbutton class=\"b g\" onclick=\"meas('T')\">⏱ Sekundomer bilan o'lcha\u003c/button>\n\u003cdiv id=\"mres\" class=\"hl\">O'lchovlar hali yo'q.\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>🃏 Fazilat kartochkalari (bos!)\u003c/h3>\n\u003cdiv class=\"cards\">\n\u003cbutton class=\"fz\" style=\"background:#ef6c4d\" onclick=\"scen(0)\">💪 Qat'iyat\u003c/button>\n\u003cbutton class=\"fz\" style=\"background:#2bb0a0\" onclick=\"scen(1)\">🙏 Kamtarlik\u003c/button>\n\u003cbutton class=\"fz\" style=\"background:#8b5cf6\" onclick=\"scen(2)\">🗣 Rostgo'ylik\u003c/button>\n\u003cbutton class=\"fz\" style=\"background:#e6a100\" onclick=\"scen(3)\">🦺 Mas'uliyatlilik\u003c/button>\u003c/div>\n\u003cdiv id=\"scn\" class=\"card\" style=\"display:none\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>💭 O'ylab ko'r\u003c/h3>\u003cul>\u003cli>Nega o'rtacha qiymat bitta o'lchovdan ishonchliroq?\u003c/li>\u003cli>Natijang kutilganidan farq qilsa, nima qilasan?\u003c/li>\u003cli>Laboratoriyada qanday xavfsizlik qoidalari bor?\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>✅ Mustahkamlash\u003c/h3>\u003cdiv id=\"q2\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ XULOSA ============ -->\n\u003cdiv class=\"card\" style=\"border-color:var(--c2)\">\u003ch2>🌟 Umumiy xulosa\u003c/h2>\n\u003cp>1) Taxmin qil, tajriba qil, xulosa chiqar. 2) Ishonishdan oldin tekshir, birgalikda muhokama qil. 3) Qat'iyatli, kamtar, rostgo'y va mas'uliyatli bo'l.\u003c/p>\n\u003cbutton class=\"b p\" onclick=\"resetAll()\">🔄 Qayta boshlash\u003c/button>\u003c/div>\n\u003c/div>\n\n\u003cscript>\n// ---------- Yordamchi ----------\nconst $=id=>document.getElementById(id);\nconst g=9.8;\n// Tablar\ndocument.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');\n  document.querySelectorAll('.sec').forEach((s,i)=>s.classList.toggle('on',i==b.dataset.t));\n});\n// ---------- Testlar (javob bergach darhol tekshiriladi) ----------\nconst QZ=[\n [[\"Mayatnik davri qaysi kattalikka bog'liq?\",[\"Ip uzunligiga\",\"Yuk massasiga\",\"Rangiga\"],0],\n  [\"Tajribadan keyingi oxirgi bosqich qaysi?\",[\"Gipoteza\",\"Xulosa chiqarish\",\"Savol berish\"],1]],\n [[\"Skeptik odam nima qiladi?\",[\"Hammasiga ishonadi\",\"Tekshirib ko'radi\",\"Bahslashmaydi\"],1],\n  [\"Havosiz joyda tosh va patning tushishi qanday?\",[\"Birga tushadi\",\"Tosh oldin\",\"Pat oldin\"],0]],\n [[\"Bir necha o'lchovdan nima olamiz?\",[\"Eng kattasini\",\"O'rtacha qiymatni\",\"Eng kichigini\"],1],\n  [\"Natija kutilganidan farq qilsa nima qilamiz?\",[\"O'zgartirib yozamiz\",\"Rostini yozamiz\",\"Yozmaymiz\"],1]]];\nfunction quiz(i){\n  const box=$('q'+i);box.innerHTML='';\n  QZ[i].forEach(([q,o,a])=>{\n    const d=document.createElement('div');d.innerHTML='\u003cb>'+q+'\u003c/b>';\n    const fb=document.createElement('div');fb.className='note';\n    o.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;\n      b.onclick=()=>{ if(d.dataset.done)return;d.dataset.done=1;\n        b.classList.add(k==a?'ok':'no');if(k!=a)d.querySelectorAll('.opt')[a].classList.add('ok');\n        fb.textContent=k==a?'✅ To\\'g\\'ri!':'❌ Noto\\'g\\'ri. To\\'g\\'ri javob belgilandi.';};\n      d.appendChild(b);});\n    d.appendChild(fb);box.appendChild(d);});\n}\n// ---------- 1-BO'LIM: Mayatnik ----------\nconst c0=$('cv0').getContext('2d');\nlet hypo=null,rows=[],t0=0,lastCross=null,measT=null,prevTh=1;\nconst Lv=()=>+$('rL').value,Mv=()=>+$('rM').value,Av=()=>+$('rA').value;\nconst Tcalc=()=>2*Math.PI*Math.sqrt(Lv()/g); // T = 2π√(L/g)\nfunction setStep(n){for(let i=0;i\u003c3;i++)$('st'+i).classList.toggle('on',i==n)}\nfunction hyp(h){hypo=h;setStep(1);$('hypTx').textContent='Gipoteza qabul qilindi: massa '+(h=='ha'?'ta\\'sir qiladi':'ta\\'sir qilmaydi')+'. Endi tajriba qil — kamida 3 o\\'lchov qo\\'sh.';}\n['rL','rM','rA'].forEach(id=>$(id).oninput=()=>{$('vL').textContent=Lv().toFixed(1);$('vM').textContent=Mv().toFixed(1);$('vA').textContent=Av();t0=performance.now();lastCross=null;measT=null;prevTh=1;});\nfunction addRow(){\n  const T=(measT||Tcalc()).toFixed(2);\n  rows.push([Lv(),Mv(),Av(),T]);\n  $('tb').innerHTML+='\u003ctr>\u003ctd>'+Lv().toFixed(1)+'\u003c/td>\u003ctd>'+Mv().toFixed(1)+'\u003c/td>\u003ctd>'+Av()+'°\u003c/td>\u003ctd>'+T+'\u003c/td>\u003c/tr>';\n  if(hypo)setStep(1);\n}\nfunction concl(){\n  const d=$('conc');d.style.display='block';\n  if(rows.length\u003c3){d.textContent='Avval kamida 3 ta o\\'lchov qo\\'sh. Massani va uzunlikni alohida o\\'zgartirib ko\\'r!';return;}\n  setStep(2);\n  d.innerHTML='\u003cb>Xulosa:\u003c/b> massa o\\'zgarganda T deyarli o\\'zgarmaydi, ip uzunligi ortsa T ortadi. '+\n   (hypo=='yoq'?'🎉 Sening gipotezang to\\'g\\'ri chiqdi!':hypo=='ha'?'Gipotezang tasdiqlanmadi — bu ham ilmiy natija!':'Keyingi safar gipoteza ham qo\\'y.');\n}\nfunction drawPend(now){\n  const t=(now-t0)/1000,T=Tcalc(),th0=Av()*Math.PI/180,th=th0*Math.cos(2*Math.PI*t/T);\n  // o'lchangan davr: teskari yo'nalishdan o'tish momentlari\n  if(prevTh\u003c0&&th>=0){if(lastCross!==null)measT=(now-lastCross)/1000;lastCross=now;}\n  prevTh=th;\n  $('tT').textContent=T.toFixed(2);$('tM').textContent=measT?measT.toFixed(2):'...';\n  const W=360,px=110,x0=180,y0=20,bx=x0+Lv()*px*Math.sin(th),by=y0+Lv()*px*Math.cos(th);\n  c0.clearRect(0,0,W,250);c0.fillStyle='#8b5cf6';c0.fillRect(120,10,120,10);\n  c0.strokeStyle='#444';c0.lineWidth=2;c0.beginPath();c0.moveTo(x0,y0);c0.lineTo(bx,by);c0.stroke();\n  c0.fillStyle='#ff7a59';c0.beginPath();c0.arc(bx,by,8+Mv()*6,0,7);c0.fill();\n}\n// ---------- 2-BO'LIM: Dialog va tushish ----------\nconst DL=[[\"az\",\"🧒 Aziz: Og'ir jism tezroq tushadi, bu aniq!\"],[\"ma\",\"👧 Malika: Aniqmi? Buni qayerdan bilasan? Tekshirib ko'raylikmi?\"],[\"az\",\"🧒 Aziz: Yaxshi, tosh va qog'oz to'pini tashlaymiz!\"],[\"ma\",\"👧 Malika: Ajoyib! Havo qarshiligini yoqib ham, o'chirib ham ko'ramiz.\"]];\nlet di=0;\nfunction nextD(){if(di\u003cDL.length){const b=document.createElement('div');b.className='bub '+DL[di][0];b.textContent=DL[di][1];$('dlg').appendChild(b);di++;}\n  if(di>=DL.length)$('dnx').style.display='none';}\nconst c1=$('cv1').getContext('2d');\nlet air=false,fall=null; // fall: {t, o:[{y,v,t}]}\nconst K={rock:0.1,paper:1.2}; // qarshilik koeffitsiyenti\nconst H=20; // balandlik, m\nfunction toggleAir(){air=!air;$('airB').textContent=\"💨 Havo qarshiligi: \"+(air?\"YOQIQ\":\"O'CHIQ\");}\nfunction drop(){fall={o:[{y:0,v:0,t:null,k:K.rock},{y:0,v:0,t:null,k:K.paper}],t:0,air:air,last:performance.now()};$('res').textContent='Tushmoqda...';}\nfunction drawFall(now){\n  if(fall){const dt=Math.min((now-fall.last)/1000,.05);fall.last=now;\n    if(!fall.done){fall.t+=dt;\n      fall.o.forEach(o=>{if(o.t===null){const k=fall.air?o.k:0;o.v+=(g-k*o.v)*dt;o.y+=o.v*dt;if(o.y>=H){o.y=H;o.t=fall.t;}}});\n      if(fall.o.every(o=>o.t!==null)){fall.done=1;const[a,b]=fall.o;\n        $('res').innerHTML='Havo qarshiligi '+(fall.air?'yoqiq':'o\\'chiq')+': tosh \u003cb>'+a.t.toFixed(2)+' s\u003c/b>, qog\\'oz to\\'pi \u003cb>'+b.t.toFixed(2)+' s\u003c/b>. '+\n        (fall.air?'Havo qarshiligi yengil jismni sekinlatdi!':'Ikkalasi bir vaqtda tushdi — massa ahamiyatsiz!');}}}\n  c1.clearRect(0,0,360,260);c1.fillStyle='#b7e4a5';c1.fillRect(0,245,360,15);\n  c1.fillStyle='#555';c1.font='14px sans-serif';c1.fillText('Tosh',100,16);c1.fillText('Qog\\'oz',215,16);\n  [[120,'#777',12],[240,'#f7a8c4',12]].forEach(([x,col,r],i)=>{\n    const y=25+(fall?fall.o[i].y:0)*10.5;c1.fillStyle=col;c1.beginPath();c1.arc(x,y,r,0,7);c1.fill();});\n}\n// ---------- 3-BO'LIM: O'lchash ----------\nconst M={L:[],T:[]},TR={L:15,T:2},SP={L:.5,T:.3};\nfunction meas(k){\n  M[k].push(TR[k]+(Math.random()*2-1)*SP[k]);draw3();}\nfunction draw3(){\n  let h='';[['L','📏 Uzunlik','sm'],['T','⏱ Vaqt','s']].forEach(([k,n,u])=>{\n    const a=M[k];if(!a.length)return;u=k=='L'?'sm':'s';\n    h+='\u003cp>\u003cb>'+n+':\u003c/b> '+a.map(v=>v.toFixed(2)).join('; ')+' '+u+'\u003cbr>O\\'rtacha: \u003cb>'+(a.reduce((s,v)=>s+v,0)/a.length).toFixed(2)+' '+u+'\u003c/b> ('+a.length+' ta o\\'lchov)\u003c/p>';});\n  $('mres').innerHTML=h||\"O'lchovlar hali yo'q.\";\n}\nconst SC=[\n [\"💪 Qat'iyat\",\"Birinchi o'lchoving boshqalardan ancha farq qildi. Sen nima qilarding?\",[[\"Tashlab qo'yardim\",0],[\"Yana bir necha marta o'lchardim\",1],[\"Eng chiroyli natijani tanlardim\",0]],\"Takroriy o'lchash ishonchli natija beradi.\"],\n [\"🙏 Kamtarlik\",\"Chizg'ichni noto'g'ri qo'yganingni payqading. Sen nima qilarding?\",[[\"Hech kimga aytmasdim\",0],[\"Xatoni tan olib, qayta o'lchardim\",1],[\"Do'stimni ayblardim\",0]],\"Xatoni tan olish olimni kuchli qiladi.\"],\n [\"🗣 Rostgo'ylik\",\"Natija kutganingdek chiqmadi. Sen nima qilarding?\",[[\"O'zgartirib yozardim\",0],[\"Qanday bo'lsa, shunday yozardim\",1],[\"Do'stimdan ko'chirardim\",0]],\"Kutilmagan natija ko'pincha yangi kashfiyotga olib boradi.\"],\n [\"🦺 Mas'uliyatlilik\",\"Laboratoriyada shisha asbob sindi. Sen nima qilarding?\",[[\"Yashirardim\",0],[\"O'qituvchiga darhol aytardim\",1],[\"Qo'lim bilan yig'ardim\",0]],\"Xavfsizlik birinchi o'rinda: darhol xabar ber.\"]];\nfunction scen(i){\n  const s=SC[i],d=$('scn');d.style.display='block';\n  d.innerHTML='\u003ch3>'+s[0]+'\u003c/h3>\u003cp>'+s[1]+'\u003c/p>\u003cb>Sen nima qilarding?\u003c/b>';\n  const fb=document.createElement('div');\n  s[2].forEach(([t,ok])=>{const b=document.createElement('button');b.className='opt';b.textContent=t;\n    b.onclick=()=>{b.classList.add(ok?'ok':'no');fb.innerHTML=ok?'✅ To\\'g\\'ri! '+s[3]:'❌ Yana o\\'ylab ko\\'r. To\\'g\\'ri yo\\'l boshqa.';};d.appendChild(b);});\n  d.appendChild(fb);\n}\n// ---------- Qayta boshlash ----------\nfunction resetAll(){\n  hypo=null;rows=[];$('tb').innerHTML='';$('conc').style.display='none';$('hypTx').textContent='';setStep(0);\n  $('rL').value=1;$('rM').value=1;$('rA').value=30;$('rL').oninput();\n  di=0;$('dlg').innerHTML='';$('dnx').style.display='';air=false;$('airB').textContent=\"💨 Havo qarshiligi: O'CHIQ\";fall=null;$('res').textContent='Natija: tajriba boshlanmagan.';\n  M.L=[];M.T=[];draw3();$('scn').style.display='none';\n  [0,1,2].forEach(quiz);\n  document.querySelector('.tab.t0').click();scrollTo(0,0);\n}\n// ---------- Asosiy sikl ----------\nfunction loop(now){drawPend(now);drawFall(now);requestAnimationFrame(loop);}\n[0,1,2].forEach(quiz);nextD();requestAnimationFrame(loop);\n/* O'QITUVCHI UCHUN TAVSIYA:\n   1) 1-bo'limda o'quvchilar juft bo'lib ishlasin: avval gipoteza yozdirib, keyin faqat BITTA parametrni o'zgartirib jadval to'ldirtiring.\n   2) 2-bo'limda dialogni sinfda rollarga bo'lib o'qitib, havo qarshiligi yoqilishidan oldin natijani taxmin qildiring.\n   3) 3-bo'limda har bir o'quvchi 5 ta o'lchov olib o'rtachani daftariga yozsin; kartochkalarni guruhlarda muhokama qildiring.\n   4) Dars oxirida \"Qayta boshlash\" tugmasi bilan navbatdagi guruhga sahifani tayyorlang. */\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "O'rganish ko'nikmalari", "icon": "🎯", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Fizika: o'rganish ko'nikmalari (7-sinf)\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --paper:#F2F7FF;--grid:#D9E7FB;--ink:#14213D;--soft:#465272;--card:#FFFFFF;--edge:#14213D;--shadow:#14213D;\n  --stage:#F8FBFF;--note:#E6F0FF;--sun:#FFC93C;--on-sun:#14213D;--sun-bg:#FFF3C4;\n  --ok:#17703F;--ok-bg:#D9F4E3;--bad:#B3202F;--bad-bg:#FDE1E4;--on-c:#FFFFFF;\n  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme:dark){\n  :root:not([data-theme=\"light\"]){\n    --paper:#0E1630;--grid:#1A2650;--ink:#EDF2FF;--soft:#B5C0E0;--card:#172248;--edge:#8DA2E0;--shadow:#050A1C;\n    --stage:#0B1228;--note:#1F2C5A;--sun-bg:#3B3210;--ok:#6EE0A0;--ok-bg:#12382A;--bad:#FF8C99;--bad-bg:#421A22;--on-c:#0E1630;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --paper:#0E1630;--grid:#1A2650;--ink:#EDF2FF;--soft:#B5C0E0;--card:#172248;--edge:#8DA2E0;--shadow:#050A1C;\n  --stage:#0B1228;--note:#1F2C5A;--sun-bg:#3B3210;--ok:#6EE0A0;--ok-bg:#12382A;--bad:#FF8C99;--ba
